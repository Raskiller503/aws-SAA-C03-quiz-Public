ce |\n\n## 三、架构与可靠性词\n\n| 术语 | 白话解释 | 常见答案方向 |\n|------|----------|--------------|\n| **Single point of failure** | 单点故障 | 多 AZ、冗余、托管服务 |\n| **Failover** | 主故障后切到备 | RDS Multi-AZ、Route 53 |\n| **RTO** | 最多能停多久 | 影响 DR 方案速度 |\n| **RPO** | 最多能丢多久数据 | 影响备份/复制频率 |\n| **DR** | 灾难恢复 | Backup、Pilot Light、Warm Standby、Active-Active |\n| **Active-Active** | 两边都在服务 | 最贵,恢复最快 |\n| **Pilot Light** | 备区只保留核心 | 比备份快,比双活便宜 |\n| **Warm Standby** | 备区小规模运行 | 恢复快但有持续成本 |\n| **Backup and Restore** | 备份后恢复 | 最便宜,恢复最慢 |\n\n## 四、数据与存储词\n\n| 术语 | 白话解释 | 常见服务 |\n|------|----------|----------|\n| **Object** | 整个文件对象 | S3 |\n| **Block** | 像硬盘块设备 | EBS |\n| **File system** | 有目录结构的共享文件 | EFS / FSx |\n| **Lifecycle policy** | 按时间自动转冷/删除 | S3、日志 |\n| **Versioning** | 同一个对象保留多个版本 | S3 防误删 |\n| **WORM** | 写一次读多次,不能改 | S3 Object Lock |\n| **Encryption at rest** | 静态数据加密 | KMS、SSE |\n| **Encryption in transit** | 传输加密 | TLS、HTTPS、VPN |\n| **IOPS** | 每秒读写次数 | 数据库、小块随机 I/O |\n| **Throughput** | 每秒传输数据量 | 大文件、日志、视频 |\n\n## 五、数据库词\n\n| 术语 | 白话解释 | 常见服务 |\n|------|----------|----------|\n| **OLTP** | 在线交易,小而频繁的读写 | RDS、Aurora、DynamoDB |\n| **OLAP** | 分析查询,扫大量数据 | Redshift、Athena |\n| **Read Replica** | 只读副本 | 读扩展 |\n| **Multi-AZ** | 跨 AZ 高可用 | 自动故障转移 |\n| **ACID** | 事务可靠性的四个特性 | RDS/Aurora 典型 |\n| **Eventually consistent** | 最终一致 | DynamoDB/S3 常见概念 |\n| **Strongly consistent** | 强一致 | 读到最新写入,可能更贵/更慢 |\n| **Cache** | 内存缓存 | ElastiCache、DAX |\n| **CDC** | 捕获数据变化 | DMS、DynamoDB Streams、Kinesis |\n\n## 六、消息与事件词\n\n| 术语 | 白话解释 | 常见服务 |\n|------|----------|----------|\n| **Queue** | 队列,任务排队处理 | SQS |\n| **Topic** | 主题,广播给订阅者 | SNS |\n| **Event bus** | 事件总线,按规则转发 | EventBridge |\n| **Stream** | 连续数据流 | Kinesis、MSK |\n| **Fan-out** | 一条消息分发给多个下游 | SNS -> SQS |\n| **DLQ** | 死信队列,放失败消息 | SQS / Lambda |\n| **Visibility Timeout** | 消息被取走后暂时不可见 | SQS |\n| **At-least-once** | 至少投递一次,可能重复 | SQS Standard、Lambda 异步 |\n| **Idempotent** | 重复执行也结果正确 | 处理重复消息必备 |\n| **Replay** | 重新播放历史事件 | Kinesis、EventBridge |\n\n## 七、安全词\n\n| 术语 | 白话解释 | 常见服务 |\n|------|----------|----------|\n| **Principal** | 谁发起请求 | User、Role、Service |\n| **Policy** | 权限规则 | IAM、S3 Bucket Policy |\n| **Role** | 可被临时扮演的身份 | EC2/Lambda/跨账号 |\n| **AssumeRole** | 扮演一个 Role 获取临时权限 | STS |\n| **SCP** | 账号/OU 权限上限 | Organizations |\n| **Permission Boundary** | 单个 User/Role 的权限上限 | 防止自我提权 |\n| **KMS key** | 加密密钥 | SSE-KMS、EBS/RDS 加密 |\n| **Envelope Encryption** | 用数据密钥加密大数据,KMS 保护数据密钥 | KMS |\n| **PII** | 个人敏感信息 | Macie |\n| **CVE** | 已知漏洞编号 | Inspector |\n\n## 八、运维与成本词\n\n| 术语 | 白话解释 | 常见服务 |\n|------|----------|----------|\n| **Metric** | 数字指标 | CloudWatch |\n| **Log** | 文本日志 | CloudWatch Logs |\n| **Trace** | 一次请求经过哪些服务 | X-Ray |\n| **Audit trail** | 审计记录 | CloudTrail |\n| **Compliance rule** | 合规规则 | Config |\n| **Right-sizing** | 调整到合适规格 | Compute Optimizer |\n| **Reserved / Savings Plans** | 承诺使用换折扣 | 成本优化 |\n| **Spot** | 便宜但可中断容量 | 批处理、可重试任务 |\n| **Data transfer out** | 数据出公网费用 | CloudFront、架构选型 |\n| **Cost allocation tag** | 成本分摊标签 | Cost Explorer、CUR |\n\n## 九、最容易混的词\n\n| 易混词 | 一句话区分 |\n|--------|------------|\n| **Availability vs Durability** | Availability 是服务能不能访问;Durability 是数据会不会丢 |\n| **Multi-AZ vs Read Replica** | Multi-AZ 管故障切换;Read Replica 管读性能 |\n| **CloudWatch vs CloudTrail** | CloudWatch 看运行状态;CloudTrail 看谁调用了 API |\n| **SQS vs SNS** | SQS 是排队给一个消费者;SNS 是广播给多个订阅者 |\n| **Kinesis vs SQS** | Kinesis 可重放且多消费者读同一份流;SQS 消费后删除 |\n| **WAF vs Shield** | WAF 防应用层规则攻击;Shield 防 DDoS |\n| **Gateway Endpoint vs Interface Endpoint** | Gateway 只给 S3/DynamoDB 且无小时费;Interface 给大多数服务且收费 |\n| **NAT Gateway vs Internet Gateway** | NAT 给私有子网主动出网;IGW 是 VPC 公网出入口 |\n| **DataSync vs Storage Gateway** | DataSync 偏迁移/同步;Storage Gateway 偏长期混合访问 |\n\n回到:[`12-考前冲刺与答题套路.md`](12-考前冲刺与答题套路.md)\n"}]</script>

CHAPTERS.forEach((ch, i) => {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = '#' + ch.id;
  a.textContent = ch.title;
  a.dataset.idx = i;
  li.appendChild(a);
  tocList.appendChild(li);
});

// Marked + highlight.js — preprocess to drop the leading "# Title" line so we
// don't render two H1s (the TOC already shows the title).
function renderChapter(idx) {
  const ch = CHAPTERS[idx];
  if (!ch) return;

  let md = ch.content;
  // Strip the first leading "# ..." line if any
  md = md.replace(/^\s*#[^\n]*\n?/, '');

  // Configure marked
  marked.setOptions({
    breaks: false,
    gfm: true,
    headerIds: true,
  });
  const html = marked.parse(md);

  let prevNext = '<div class="chapter-nav">';
  if (idx > 0) {
    prevNext += `<a href="#${CHAPTERS[idx-1].id}"><span class="dir">← 上一章</span>${CHAPTERS[idx-1].title}</a>`;
  } else {
    prevNext += `<span class="placeholder"></span>`;
  }
  if (idx < CHAPTERS.length - 1) {
    prevNext += `<a class="next" href="#${CHAPTERS[idx+1].id}"><span class="dir">下一章 →</span>${CHAPTERS[idx+1].title}</a>`;
  } else {
    prevNext += `<span class="placeholder"></span>`;
  }
  prevNext += '</div>';

  content.innerHTML = `<h1>${ch.title}</h1>` + html + prevNext;

  // Code highlight
  content.querySelectorAll('pre code').forEach(block => {
    try { hljs.highlightElement(block); } catch (e) {}
  });

  // Mark active
  tocList.querySelectorAll('a').forEach((a, i) => {
    a.classList.toggle('active', i === idx);
  });

  // Rewrite intra-doc links: "01-架构师...md" -> "#01-架构师..."
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href')).replace(/\.md$/, '');
    a.setAttribute('href', '#' + target);
  });

  // Scroll to top on chapter switch
  window.scrollTo({ top: 0, behavior: 'auto' });

  // Close TOC on mobile after click
  if (window.innerWidth <= 900) toc.classList.remove('open');
}

function loadFromHash() {
  let hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!hash) {
    renderChapter(0);
    return;
  }
  const idx = CHAPTERS.findIndex(c => c.id === hash);
  renderChapter(idx >= 0 ? idx : 0);
}

window.addEventListener('hashchange', loadFromHash);
loadFromHash();

// Theme toggle
const savedTheme = localStorage.getItem('saa-theme');
if (savedTheme === 'dark') document.body.classList.add('dark');
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('saa-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});

// Mobile TOC toggle
menuToggle.addEventListener('click', () => toc.classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (window.innerWidth > 900) return;
  if (e.target.closest('#toc') || e.target.closest('#menuToggle')) return;
  toc.classList.remove('open');
});
</script>
</body>
</html>

aged** | 要打补丁、要扩容 | 题目说 \"fully managed\" 时排除 |\n| **NAT instance**(不是 NAT Gateway) | 单点故障、需自己运维 | 几乎永远是错误选项 |\n| **重新设计/重写应用** | 改动太大 | 题目说 \"minimal changes\" 时排除 |\n| **跨 Region 复制 + 反向同步** | 复杂、慢 | 大多数题目里都不是\"最\"优解 |\n| **存到 EBS 然后 Snapshot 再恢复** | 多余的中间步骤 | 直接 S3 几乎总更好 |\n| **Snowball** 用于日常 < TB 传输 | 大材小用 | 只有 PB 级别 + 网络差才该选 |\n| **用 EC2 跑数据库** 而不是 RDS | 运维高 | 题目要\"managed\"时排除 |\n\n## 三、SAA 的\"四种问法母模板\"\n\n你会发现 1019 道题 95% 都套这四个模板:\n\n### 模板 1:可用性 / 弹性\n> \"一个应用部署在单 AZ 的 EC2 上,公司要求**避免任何单点故障**……\"\n\n**答题套路**:\n- 多 AZ + ASG + ALB(无状态服务)\n- RDS Multi-AZ(数据库)\n- S3(对象天然多 AZ)\n- DynamoDB Global Tables(跨 Region)\n- Route 53 健康检查 + Failover routing\n\n### 模板 2:性能\n> \"查询数据库的请求延迟太高 / 大流量下 RDS CPU 100% ……\"\n\n**答题套路**:\n- 读多写少 → **ElastiCache**(Redis / Memcached)\n- 读多但要持久 → **RDS Read Replica**\n- 写多 → **Aurora**(更高吞吐)或拆 **DynamoDB**\n- 静态资源慢 → **CloudFront**\n- 跨区域上传慢 → **S3 Transfer Acceleration** 或 **Multipart Upload**\n\n### 模板 3:解耦 / 异步\n> \"前端请求峰值时后端处理不过来 / 一个服务挂了影响整条链路 ……\"\n\n**答题套路**:\n- 削峰填谷 → **SQS**\n- 一对多扇出 → **SNS**(或 SNS → SQS Fan-out)\n- 事件驱动 / 跨服务 → **EventBridge**\n- 工作流编排 → **Step Functions**\n- 实时流式数据 → **Kinesis Data Streams**\n\n### 模板 4:成本优化\n> \"成本太高 / 闲置资源 / 长期可预测负载 ……\"\n\n**答题套路**:\n- 可预测的常年负载 → **Savings Plan / Reserved Instances**\n- 容错性强的批处理 → **Spot Instances**\n- 冷数据存储 → **S3 Intelligent-Tiering / Glacier**\n- 短期低频任务 → **Lambda / Fargate**\n- 闲置资源识别 → **Trusted Advisor / Cost Explorer**\n\n## 四、学习节奏建议\n\n### 看每一个服务时,问自己 5 个问题\n\n1. **它解决了什么问题?**(没有它,我会怎样痛苦?)\n2. **它的\"对手\"是谁?**(同类服务里,选它而不选别人的理由?)\n3. **它的硬约束是什么?**(配额、最大 size、时延、强一致还是最终一致?)\n4. **它的默认设置安全吗?**(默认是否公开、是否加密、是否多 AZ?)\n5. **它怎么收费?**(按存储 / 按请求 / 按运行时长 / 数据出口?)\n\n### 不要做的事\n\n- ❌ 把每个服务的所有 feature 都背一遍(没必要)\n- ❌ 死记每种实例族(只需知道大类:通用 M、计算 C、内存 R、存储 I/D、GPU P/G)\n- ❌ 用看视频代替做题 + 复盘(视频带不来\"做选择\"的肌肉记忆)\n\n### 必须做的事\n\n- ✅ 每道错题写一句**归因**:我错是因为不知道 X 服务的 Y 特性 / 我没读到题目里 Z 关键词\n- ✅ 用本仓库 `quiz-app` 的\"错题\"过滤器二刷\n- ✅ 临考 1 周内,只做错题 + 模考\n\n---\n\n**下一章**:[`01-架构师的全局视图.md`](01-架构师的全局视图.md) — Region / AZ / VPC / Account 的全局结构,你将看到所有服务怎么\"挂\"在这张地图上。\n"}, {"id": "01-架构师的全局视图", "title": "01 · 架构师的全局视图", "filename": "01-架构师的全局视图.md", "content": "# 01 · 架构师的全局视图\n\n> 在学具体服务前,先把\"AWS 的地理 / 网络 / 账号\"这张大底图画清楚。所有后面的服务都是挂在这张底图上的。\n\n## 本章先懂这些词\n\n这章的目标不是背所有网络细节,而是先能在脑子里摆位置:一个资源在哪个 Region、哪个 AZ、哪个子网、哪个账号里。初学时只要把\"位置 + 权限 + 出入口\"串起来,后面的服务会好理解很多。\n\n| 术语 | 白话解释 | 初学者抓手 |\n|------|----------|------------|\n| **Account** | AWS 账号,也是权限和账单边界 | 生产、开发常拆成不同账号 |\n| **Region** | AWS 的地理区域 | 选离用户近、合规允许的区域 |\n| **AZ** | 一个 Region 里的独立机房组 | 多 AZ 是高可用基础 |\n| **VPC** | 你在 AWS 里的私有网络 | 像一块自己划出来的云上机房 |\n| **Subnet** | VPC 里的一段网段,只能属于一个 AZ | Public / Private 的区别主要看路由 |\n| **Public Subnet** | 有路由去 Internet Gateway 的子网 | 常放 ALB、NAT Gateway、堡垒机 |\n| **Private Subnet** | 没有直接公网入口的子网 | 常放 EC2 应用、RDS、内部服务 |\n| **Route Table** | 告诉流量下一跳去哪 | 判断\"能不能通\"先看它 |\n\n## 一、四层\"位置\"层级 — 从外到内\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│ Partition(分区:aws、aws-cn、aws-us-gov)                    │\n│ ┌─────────────────────────────────────────────────────────┐ │\n│ │ Region(区域:us-east-1, ap-southeast-1, …)              │ │\n│ │ ┌──────────────┐ ┌──────────────┐ ┌──────────────┐      │ │\n│ │ │ AZ a         │ │ AZ b         │ │ AZ c         │      │ │\n│ │ │ ┌──────────┐ │ │ ┌──────────┐ │ │ ┌──────────┐ │      │ │\n│ │ │ │  Subnet  │ │ │ │  Subnet  │ │ │ │  Subnet  │ │      │ │\n│ │ │ │ (VPC 内) │ │ │ │ (VPC 内) │ │ │ │ (VPC 内) │ │      │ │\n│ │ │ └──────────┘ │ │ └──────────┘ │ │ └──────────┘ │      │ │\n│ │ └──────────────┘ └──────────────┘ └──────────────┘      │ │\n│ │           Edge Locations(CloudFront / Route 53)         │ │\n│ └─────────────────────────────────────────────────────────┘ │\n└─────────────────────────────────────────────────────────────┘\n```\n\n| 层级 | 含义 | 故障域 |\n|------|------|--------|\n| Partition | 法律 / 监管隔离的 AWS 大区(中国 vs 全球 vs 美国政府)| 完全隔离 |\n| Region | 一个城市群,典型有 3–6 个 AZ | 地震 / 全城断电 |\n| Availability Zone(AZ) | 一个或多个物理数据中心(同 Region 内) | 单数据中心 |\n| Subnet | VPC 切片,**绑定到唯一 AZ** | 网段级 |\n| Edge Location | CDN 节点,数百个全球分布 | — |\n\n### 关键考点\n\n- **AZ 之间** 低延迟(< 1ms 通常),走 AWS 骨干网,**Region 内 AZ 间数据传输也收费(免费的是 S3 → 同 Region EC2 这类)** — 多选题里小心。\n- **Region 之间** 走加密的 AWS 骨干,但**默认要付出口费**。\n- **Edge Locations** 不只是 CloudFront,还托管 Lambda@Edge、Route 53、Global Accelerator、AWS Shield、WAF。\n\n## 二、账户结构 — Organizations\n\n```\n        ┌──────────────────────┐\n        │  Management Account  │  ← 付款账户,启用 SCP\n        └──────────┬───────────┘\n                   │\n        ┌──────────┴──────────┐\n        │   Root OU           │\n        │  ┌───────────────┐  │\n        │  │  Prod OU      │  │  ← Service Control Policies (SCP)\n        │  │   ├─ Acct A   │  │     在这一层批量限制下面账号\n        │  │   └─ Acct B   │  │\n        │  │  Dev OU       │  │\n        │  │   ├─ Acct C   │  │\n        │  │   └─ Acct D   │  │\n        │  │  Sandbox OU   │  │\n        │  │   └─ Acct E   │  │\n        └──┴───────────────┴──┘\n```\n\n### 必须记住的服务\n\n| 服务 | 一句话 | 题目里见到该选 |\n|------|--------|----------------|\n| **AWS Organizations** | 多账号集中管理 | 题目说\"多个 AWS 账号\" |\n| **SCP(Service Control Policy)** | OU/账号级\"上限\"权限策略 | 题目说\"防止某账号开 c5.24xlarge\"或\"阻止某 region\" |\n| **AWS Control Tower** | 一键搭好 landing zone(Org + 配置基线) | 题目说\"快速搭多账号合规基线\" |\n| **Consolidated Billing** | 合并账单、共享 RI/SP 折扣 | 题目说\"统一开票\" |\n| **AWS IAM Identity Center**(原 SSO) | 跨账号 / 应用 SSO,与 AD / Okta 联邦 | 题目说\"统一登录多账号 + 联邦企业目录\" |\n\n### SCP 的陷阱\n\n- SCP **不授予权限**,它只是\"上限\"(deny list / allow list)。**用户实际权限 = IAM 策略 ∩ SCP**。\n- SCP **作用于成员账号的 IAM 用户和角色**,**但不作用于 Management Account 的根用户**。\n- 题目说\"无论账号管理员怎么改 IAM,都不能开某 Region\" → SCP。\n\n## 三、VPC — 你的私有数据中心\n\n> VPC 是 SAA 题目里**出现频率最高**的对象之一。强烈建议自己画一遍下面这张拓扑。\n\n```\n                 Internet\n                    │\n            ┌───────┴────────┐\n            │ Internet Gateway│\n            └───────┬────────┘\n                    │\n   ┌────────────────┴─────────────────┐ VPC (10.0.0.0/16)\n   │                                  │\n   │  ┌─────────┐         ┌─────────┐ │\n   │  │ Public  │         │ Public  │ │\n   │  │ Subnet  │         │ Subnet  │ │\n   │  │ (AZ-a)  │         │ (AZ-b)  │ │\n   │  │  ┌───┐  │         │  ┌───┐  │ │\n   │  │  │ALB│  │         │  │NAT│  │ │  ← NAT Gateway 也要多 AZ 高可用\n   │  │  └───┘  │         │  └───┘  │ │\n   │  └────┬────┘         └────┬────┘ │\n   │       │                   │      │\n   │  ┌────┴────┐         ┌────┴────┐ │\n   │  │ Private │         │ Private │ │\n   │  │ Subnet  │         │ Subnet  │ │\n   │  │ (AZ-a)  │         │ (AZ-b)  │ │\n   │  │  ┌───┐  │         │  ┌───┐  │ │\n   │  │  │EC2│  │         │  │EC2│  │ │\n   │  │  └───┘  │         │  └───┘  │ │\n   │  └─────────┘         └─────────┘ │\n   │                                  │\n   │   ┌──────────────┐               │\n   │   │ DB Subnet    │  (用于 RDS,  │\n   │   │ (Private)    │   两个 AZ)   │\n   │   └──────────────┘               │\n   └──────────────────────────────────┘\n```\n\n### 关键概念区分(SAA 高频考点)\n\n| 概念 | 作用范围 | 状态 | 默认行为 |\n|------|----------|------|----------|\n| **Security Group**(安全组) | 实例级(ENI 级) | **stateful**(响应自动放行) | 默认拒绝所有入站,允许所有出站 |\n| **Network ACL**(NACL) | 子网级 | **stateless**(响应需显式规则) | 默认全放行 |\n| **Route Table** | 子网级 | — | 默认仅 VPC 内 local 路由 |\n\n**记忆口诀**:**S**ecurity Group = **S**tateful;**N**ACL = **N**umbered + Stateless。\n\n### VPC 连接方式 — 何时用哪个?\n\n| 需求 | 选择 |\n|------|------|\n| VPC 内出公网 | Internet Gateway(IGW) |\n| 私有子网出公网(单向) | **NAT Gateway**(托管、高可用、贵)/ NAT Instance(自己装,几乎不要选) |\n| 私有子网访问 S3/DynamoDB **不走公网** | **Gateway Endpoint**(免费) |\n| 私有子网访问其他 AWS 服务(SQS、SNS、KMS…)**不走公网** | **Interface Endpoint / PrivateLink**(按小时 + 数据收费) |\n| 两个 VPC 互通,同 / 跨账号 / 跨 Region | **VPC Peering**(点对点,不传递)/ **Transit Gateway**(中心辐射,可传递) |\n| 公司机房 ↔ VPC,廉价 / 加密 | **Site-to-Site VPN**(基于 IPsec,几小时上线) |\n| 公司机房 ↔ VPC,**稳定低延迟** | **Direct Connect**(物理专线,数周开通) |\n| 跨 Region 全球互联 | **Transit Gateway peering** 或 **Cloud WAN** |\n\n**陷阱**:\n- 题目说\"上线快、低成本、加密\" → **VPN**\n- 题目说\"稳定带宽 + 低延迟 + 不走公网\" → **Direct Connect**(若再要求加密 → DX + VPN over DX)\n- 题目说\"跨多个 VPC 简化路由\" → **Transit Gateway**(不是 Peering)\n- 题目说\"私有访问 S3,无需公网,**免费**\" → **Gateway Endpoint**\n\n## 四、IAM 入门(详细见第 8 章)\n\n### 三类身份\n\n```\n┌──────────┐   ┌──────────┐   ┌──────────┐\n│  User    │   │  Group   │   │  Role    │\n│ (长期凭证) │   │ (用户集合) │   │ (临时凭证) │\n└──────────┘   └──────────┘   └──────────┘\n```\n\n| 选择 | 何时用 |\n|------|--------|\n| **IAM Role** | 给 **AWS 服务**(EC2、Lambda)用 / **跨账号**访问 / **联邦身份**(SAML、OIDC、SSO) |\n| **IAM User** | 真人长期访问 — **越来越少推荐**,SAA 题目里几乎都改用 Role + Identity Center |\n| **Group** | 把 User 按职能分组,统一附加 Policy |\n\n### 关键原则\n\n- **最小权限原则(least privilege)** — SAA 经常考\"用户能改 IAM 但不该改\"的场景,答案多是 **SCP + IAM Permission Boundary** 限制上限。\n- **凭证**:**长期** = Access Key(尽量不用);**短期** = STS AssumeRole(推荐)\n- **凭证泄露怎么办?** — 立刻 **rotate Access Key**;若用 Role/STS,等过期就失效。\n\n## 五、自查清单(完成本章后)\n\n读完别走,自测一下:\n\n- [ ] 我能用一句话区分 Region / AZ / Subnet 各自的故障域\n- [ ] 我知道 SG 和 NACL 谁是 stateful、作用范围\n- [ ] 我知道私有子网访问 S3 该选什么(免费的那个)\n- [ ] 我能说出 VPN vs Direct Connect 的关键差异(成本 / 上线时间 / 带宽 / 加密)\n- [ ] 我知道 SCP 不是\"赋权\"而是\"上限\"\n- [ ] 我能画出一个标准 3 层 VPC 拓扑(ALB → EC2 → RDS,多 AZ)\n\n下一章:[`02-存储选型决策树.md`](02-存储选型决策树.md)\n"}, {"id": "02-存储选型决策树", "title": "02 · 存储选型决策树", "filename": "02-存储选型决策树.md", "content": "# 02 · 存储选型决策树\n\n> SAA 至少 1/4 的题在问\"用什么存\"。掌握这张决策树,你不需要记 50 个参数,只需要做 5 个判断。\n\n## 本章先懂这些词\n\n存储题最怕一上来就背产品名。先判断数据形态:是\"像文件一样整块拿取\",还是\"像硬盘一样给机器挂载\",还是\"多台机器要共享同一套目录\"。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **Object storage** | 对象存储,把每个文件当成一个对象 | S3,适合图片、日志、备份、数据湖 |\n| **Block storage** | 块存储,像一块硬盘 | EBS,通常挂到一台 EC2 |\n| **File storage** | 文件系统,有目录和文件路径 | EFS / FSx,多台机器共享 |\n| **Durability** | 数据不丢的概率 | \"11 个 9\"说的是持久性,不是永不宕机 |\n| **Availability** | 服务可访问的概率 | Multi-AZ 常提升可用性 |\n| **Lifecycle** | 按时间自动转存储类或删除 | 冷数据省钱题高频出现 |\n| **Archive** | 归档,便宜但取回慢或要付费 | 合规长期保存常选 Glacier 系列 |\n\n## 一、第一性问题:你的数据\"长什么样\"?\n\n```\n                你要存什么?\n                    │\n   ┌────────────────┼────────────────┐\n   │                │                │\n对象 (文件、图片、    │            块 (操作系统盘、\n日志、备份)          文件 (要 POSIX、       数据库自管文件)\n   │                共享文件系统)         │\n   ▼                    │                ▼\n  S3                    ▼              EBS\n                    EFS / FSx          (单 EC2 attach)\n```\n\n| 数据形态 | AWS 服务 | 一句话 |\n|----------|----------|--------|\n| **对象**(任意大小、不需修改中间字节) | **S3** | 互联网级、键值对存储,11 个 9 持久性 |\n| **块**(像硬盘,挂载到一台机器) | **EBS** | EC2 的 SSD/HDD 卷 |\n| **共享文件**(Linux NFS / Windows SMB) | **EFS / FSx** | 多台机器同时挂载读写 |\n\n## 二、S3 — 最重要的存储服务\n\n### 2.1 存储类别(必背)\n\n```\n访问频率              存储类                  最小存储天数    取回成本\n高频(每天)         Standard               无              免费(请求另算)\n低频但要快          Standard-IA            30 天          按 GB 取回\n低频 + 单 AZ        One Zone-IA            30 天          按 GB\n未知模式            Intelligent-Tiering    无              自动迁移,小监控费\n归档(分钟级取回)   Glacier Instant Retrieval  90 天      ~毫秒\n归档(灵活)        Glacier Flexible Retrieval 90 天    分钟–小时\n深度归档(便宜)    Glacier Deep Archive   180 天          12 小时\n```\n\n### 决策套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"未知 / 不可预测访问模式,自动省钱\" | **Intelligent-Tiering** |\n| \"30 天后基本不访问,但要快取回\" | Standard → 30 天后 **Standard-IA** |\n| \"数据可重建、不重要\" | **One Zone-IA**(便宜 20%,但仅单 AZ) |\n| \"7 年合规归档,几乎不取回\" | **Glacier Deep Archive** |\n| \"归档但偶尔需要毫秒取回\" | **Glacier Instant Retrieval** |\n| \"用 lifecycle policy 自动转\" | Lifecycle Configuration(`Transition` + `Expiration` 动作) |\n\n### 2.2 加密\n\n| 类型 | 缩写 | 谁管密钥 |\n|------|------|----------|\n| Server-Side, S3-Managed | **SSE-S3** | AWS,默认开启(新桶) |\n| Server-Side, KMS-Managed | **SSE-KMS** | 你在 KMS 里管密钥 |\n| Server-Side, **Customer**-Provided | **SSE-C** | 你自带密钥 |\n| Client-Side | **CSE** | 上传前自己加密 |\n| Dual-Layer Server-Side(KMS) | **DSSE-KMS** | 合规级双层加密 |\n\n**陷阱**:\n- 题目说\"AWS 管密钥但要审计每次使用\" → **SSE-KMS**(KMS 调用会进 CloudTrail)\n- 题目说\"对客户证明 AWS 拿不到密钥\" → **SSE-C** 或 **CSE**\n- 2023 后新桶默认 SSE-S3 加密,**强制加密**靠 **bucket policy** 拒绝未加密 PUT。\n\n### 2.3 安全控制 — 控制访问的 6 把锁\n\n| 控制 | 范围 | 备注 |\n|------|------|------|\n| **Bucket Policy** | 桶级 | JSON,可跨账号,常用 |\n| **IAM Policy** | 用户/角色级 | 标准 IAM |\n| **ACL** | 对象级 | 老古董,新建议关掉 |\n| **Block Public Access** | 账号 / 桶 | 强制 \"拒绝公开\" 总开关 |\n| **VPC Endpoint Policy** | 网络入口 | 仅允许某 VPC 访问桶 |\n| **Object Ownership** | 桶 | 设置 \"Bucket Owner Enforced\" 后 ACL 不再生效 |\n\n**SAA 高频题**:\n- 题目说\"防止任何人意外把桶公开\" → **S3 Block Public Access**(账号级)\n- 题目说\"只允许特定 VPC 访问桶\" → **Gateway Endpoint + bucket policy 限制 aws:sourceVpce**\n- 题目说\"允许另一个账号读\" → **Bucket Policy** 加 principal(或两端用 IAM Role + AssumeRole)\n\n### 2.4 数据保护\n\n| 功能 | 一句话 | 何时用 |\n|------|--------|--------|\n| **Versioning** | 同 key 保留多版本 | 防误删、配合 lifecycle 删旧版 |\n| **MFA Delete** | 删除需要 MFA | 防恶意删除 |\n| **Object Lock + Compliance Mode** | WORM,任何人(包括 root)在保留期内不能删 | **法规级别合规**,题目里关键词:**immutable**、**WORM**、**SEC 17a-4**、**legal hold** |\n| **Object Lock + Governance Mode** | 受限的可删除 | 灵活合规 |\n| **Replication(SRR/CRR)** | 同 / 跨 Region 复制 | 灾备、低延迟读 |\n| **S3 Replication Time Control(RTC)** | 15 分钟内 99.99% 复制完成 SLA | 题目说\"15 分钟以内强一致复制\" |\n\n### 2.5 性能优化\n\n| 场景 | 选什么 |\n|------|--------|\n| 单文件 > 100 MB 上传 | **Multipart Upload** |\n| 全球用户上传到单个桶 | **Transfer Acceleration**(走 CloudFront 边缘 → S3) |\n| 频繁全球分发 | **CloudFront**(配 OAC) |\n| 大量 LIST / 高读取性能 | 设计前缀(不再需要 8 字符随机 hash,S3 已自动扩展) |\n| 海量小对象高频写 | **S3 Express One Zone**(2023 新出,单 AZ 个位数毫秒) |\n\n## 三、EBS — EC2 的硬盘\n\n### 卷类型对照(必背)\n\n| 类型 | 类别 | 典型用途 | 关键指标 |\n|------|------|----------|----------|\n| **gp3** | SSD 通用 | **首选默认**;Web 服务器、boot | 3000 IOPS / 125 MB/s 基线,可独立买更高 |\n| **gp2** | SSD 通用 | 老版,大小决定 IOPS | 100–16K IOPS,3 IOPS/GiB |\n| **io2 Block Express** | SSD Provisioned IOPS | **关键数据库 / 高 IOPS** | 最高 256K IOPS,**99.999% 持久性** |\n| **io1** | SSD Provisioned IOPS | 老版 | 最高 64K IOPS |\n| **st1** | HDD 吞吐型 | **大日志、大数据顺序读写** | 不能 boot |\n| **sc1** | HDD 冷盘 | **不常访问、便宜** | 不能 boot |\n\n### 关键性质\n\n- **EBS 卷绑定到 1 个 AZ**,EC2 必须同 AZ 才能挂。\n- **跨 AZ 迁移**:做 **Snapshot → 复制 → 在另一 AZ 创建卷**。\n- **Snapshot 存到 S3**(增量、跨 AZ),**可复制到另一 Region 做灾备**。\n- **EBS Multi-Attach**:io1/io2 支持挂到**同 AZ 内多达 16 台**实例(用于集群文件系统,不是普通文件共享)。\n\n### 加密\n\n- **EBS 默认加密**:账号级开关,新卷一律加密。\n- **Snapshot 跨账号共享**:加密的 snapshot 不能直接共享 — 必须**先共享 KMS Key**。\n\n## 四、EFS / FSx — 共享文件系统\n\n```\n                   多台 EC2 同时读写一份文件?\n                         │\n            ┌────────────┴────────────┐\n            │ Linux NFS              │ Windows SMB\n            │                        │  或 高性能并行\n            ▼                        ▼\n           EFS                    FSx 家族\n       (托管 NFS)            ┌─────────┬─────────┬─────────┐\n                            FSx for   FSx for   FSx for   FSx for\n                           Windows   Lustre    NetApp     OpenZFS\n                            (AD/SMB)  (HPC)    ONTAP      (低延迟)\n```\n\n| 服务 | 何时选 |\n|------|--------|\n| **EFS Standard** | Linux NFS,多 AZ 自动同步,弹性扩展 |\n| **EFS IA / Archive** | 低频访问降本(配合 Lifecycle Policy) |\n| **FSx for Windows File Server** | Windows 应用、Active Directory 集成、SMB |\n| **FSx for Lustre** | HPC、机器学习、SageMaker、关联 S3 数据集 |\n| **FSx for ONTAP** | 已有 NetApp 体系迁移,多协议(NFS/SMB/iSCSI) |\n| **FSx for OpenZFS** | 极低延迟 NFS、快照 / 克隆 |\n\n### 关键考点\n\n- **EFS** 跨 AZ 自动复制(默认),**EBS** 不跨 AZ。\n- 多台 EC2 同时挂载读写同一份 → **EFS**(Linux)/ **FSx for Windows**\n- 题目说 \"**Lustre + S3 数据湖**\" → **FSx for Lustre**(可直接读 S3 数据集)\n\n## 五、跨场景对比 — 一张表\n\n| 维度 | S3 | EBS | EFS | FSx |\n|------|----|----|----|----|\n| 抽象 | 对象 | 块 | 文件 | 文件 |\n| 协议 | HTTPS API | 块设备 | NFS v4 | SMB / Lustre / NFS / iSCSI |\n| 范围 | Region | 单 AZ | 多 AZ | 单 / 多 AZ(看类型) |\n| 持久性 | 11 个 9 | 5–8 个 9(看卷) | 11 个 9 | 11 个 9 |\n| 最大 size | 单对象 5TB | 单卷 16 TiB(gp3) | 弹性、PB+ | TB–PB |\n| 典型用法 | 静态、日志、备份、数据湖 | EC2 系统盘 / DB | 容器、CMS 共享 | Windows AD、HPC |\n| 计费 | 按 GB + 请求数 + 出口 | 按 GB-月 + IOPS(io)| 按 GB-月(冷热分层) | 按 GB-月 |\n\n## 六、自查清单\n\n- [ ] 我能不看资料,把题目里\"7 年合规归档,几乎不取回\"对应到正确存储类\n- [ ] 我能区分 SSE-S3、SSE-KMS、SSE-C 各自谁拿密钥\n- [ ] 我知道 Object Lock Compliance Mode 连 root 都删不了\n- [ ] 我知道 EBS Multi-Attach 只能同 AZ 且只有 io 系列支持\n- [ ] 我知道 EFS 自动多 AZ,EBS 自己要 snapshot 才能跨 AZ\n- [ ] 我知道 FSx for Lustre 是给 HPC / ML 配 S3 数据集用的\n\n下一章:[`03-数据库选型决策树.md`](03-数据库选型决策树.md)\n"}, {"id": "03-数据库选型决策树", "title": "03 · 数据库选型决策树", "filename": "03-数据库选型决策树.md", "content": "# 03 · 数据库选型决策树\n\n> 数据库题在 SAA 几乎每张试卷都占 6–8 题。**没有\"最好的数据库\"**,只有\"对这个负载最好的数据库\"。\n\n## 本章先懂这些词\n\n数据库选型先别问\"哪个服务最强\",先问数据和查询方式。如果题目强调表关系、事务和 SQL,大概率是 RDS/Aurora;如果强调海量简单读写、键值查询、自动扩展,就往 DynamoDB 想。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **SQL / 关系型** | 数据放表里,表之间可以 JOIN | RDS / Aurora |\n| **NoSQL** | 不强制表结构,按访问模式设计 | DynamoDB、DocumentDB、Keyspaces |\n| **Schema** | 数据结构定义,比如列名和类型 | \"schema-less\"常指 NoSQL 灵活结构 |\n| **JOIN** | 多张表关联查询 | 复杂 JOIN 通常别选 DynamoDB |\n| **Transaction** | 多步操作要么全成功,要么全失败 | 银行转账、订单扣库存 |\n| **Read Replica** | 只读副本,分担读压力 | 解决读性能,不是主要解决高可用 |\n| **Multi-AZ** | 跨 AZ 备用或集群部署 | 解决可用性,不是扩读性能 |\n| **Cache** | 把热点数据放内存里 | ElastiCache / DAX 降低延迟 |\n\n## 一、第一性问题:你的数据\"长什么样\"?\n\n```\n                  你的数据是?\n                       │\n   ┌───────────────────┼───────────────────────┐\n   │                   │                       │\n关系型(JOIN/事务/    NoSQL                内存级 / 缓存 / 分析\nSQL Schema)            │                       │\n   │           ┌───────┼───────┐                ┌────────┬────────┐\n   │           │       │       │                │        │        │\n   ▼           ▼       ▼       ▼                ▼        ▼        ▼\nRDS/Aurora  Key-Value Document 时序/         ElastiCache Redshift  OpenSearch\n              DynamoDB DocumentDB Timestream      (缓存)   (数仓)    (搜索)\n                              图: Neptune\n                              账本: QLDB\n```\n\n## 二、关系型数据库(RDS 家族)\n\n### 2.1 RDS 引擎选择\n\n| 引擎 | 何时选 |\n|------|--------|\n| **Aurora**(MySQL/PostgreSQL 兼容) | **新项目首选**;比原版 MySQL 快 5×、PostgreSQL 快 3×;存储自动扩展 64 TB;6 副本跨 3 AZ |\n| RDS for MySQL / PostgreSQL | 你已经有 MySQL/PG 应用,不想改 |\n| RDS for MariaDB | MariaDB 现有生态 |\n| RDS for Oracle / SQL Server | 你 license 已经买了,迁移成本高 |\n| **Amazon RDS Custom**(Oracle / SQL Server) | 需要 OS 级访问、装 agent、定制 |\n\n### 2.2 高可用 vs 性能 — 两个不同特性\n\n```\n            目的不同,别混!\n   ┌────────────────────────┐  ┌────────────────────────┐\n   │ Multi-AZ (高可用)       │  │ Read Replica (读扩展)   │\n   ├────────────────────────┤  ├────────────────────────┤\n   │ 同步复制                │  │ 异步复制(可能滞后)     │\n   │ 备用副本不可读          │  │ 副本可读(只读)         │\n   │ 主挂掉自动 failover     │  │ 不自动 failover         │\n   │ 同 Region 跨 AZ         │  │ 同/跨 Region 都可       │\n   │ 解决:可用性             │  │ 解决:读性能             │\n   └────────────────────────┘  └────────────────────────┘\n```\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"数据库可用性 99.95% + 自动 failover\" | **Multi-AZ** |\n| \"读 QPS 太高、CPU 100%\" | **Read Replica**(最多 15 个 Aurora,5 个 RDS) |\n| \"想要跨 Region 灾备\" | **Cross-Region Read Replica** 或 **Aurora Global Database** |\n| \"Aurora 跨 Region < 1 秒灾备 RPO\" | **Aurora Global Database**(RPO ~1 秒,RTO < 1 分钟) |\n| \"无服务器、按 ACU 计费、间歇性负载\" | **Aurora Serverless v2** |\n| \"数据库连接太多、Lambda 突发连接\" | **RDS Proxy**(连接复用) |\n| \"数据库无法支持 100K+ TPS 写\" | 考虑 **Aurora**(若仍不够 → DynamoDB) |\n\n### 2.3 备份 & 恢复\n\n| 方式 | 保留时长 | 何时用 |\n|------|----------|--------|\n| **Automated Backups** | 0–35 天 | 默认开启,**point-in-time recovery 到秒** |\n| **Manual Snapshots** | 永久,直到你删 | 长期保留、跨账号共享 |\n| **AWS Backup** | 中心化、跨服务 | 多服务统一备份策略 |\n\n## 三、DynamoDB — 海量 NoSQL Key-Value\n\n### 选 DynamoDB 的信号\n\n题目里若出现以下任意,**优先考虑 DynamoDB**:\n- \"数百万 / 数十亿请求/秒\"\n- \"毫秒级 / 亚毫秒延迟\"\n- \"Serverless 完全托管\"\n- \"schema-less\"\n- \"无服务器后端 + IoT / 移动 / 游戏\"\n- \"shopping cart, session store, leaderboard\"\n\n### 关键 feature\n\n| Feature | 何时用 |\n|---------|--------|\n| **On-Demand vs Provisioned** | 不可预测流量 → On-Demand;稳定 → Provisioned + Auto Scaling |\n| **DAX**(DynamoDB Accelerator) | 微秒级缓存,只对 DynamoDB |\n| **Global Tables** | 跨 Region **多主**复制,本地读写 |\n| **TTL** | 自动过期删除条目(session、临时数据) |\n| **Streams** | CDC,触发 Lambda |\n| **Transactions** | ACID 多项事务,跨表 |\n| **PITR**(Point-In-Time Recovery) | 任意点恢复(35 天) |\n\n### 容量陷阱\n\n- **强一致读**(Consistent Read)**比最终一致读贵 2 倍**,延迟更高 — 题目说\"成本最低\" → **eventually consistent** 优先。\n- **分区键设计**:高基数、均匀分布;否则会\"hot partition\"。\n\n### DynamoDB vs RDS — 一句话\n\n| 维度 | DynamoDB | RDS |\n|------|----------|-----|\n| 数据模型 | Key-Value / Document | 关系表 + JOIN |\n| 扩展 | 无上限,自动 | 垂直扩 + 读副本 |\n| 延迟 | 毫秒 | 毫秒–几十毫秒 |\n| 一致性 | 最终 / 可选强一致 | 强一致 |\n| 计费 | 请求 + 存储 | 实例 + 存储 |\n| 适合 | 互联网级 | 复杂查询、事务 |\n\n## 四、缓存层 — ElastiCache\n\n### Redis vs Memcached\n\n| 特性 | Redis | Memcached |\n|------|-------|-----------|\n| 持久化 | ✅ AOF + RDB | ❌ 纯内存 |\n| 复制 / Multi-AZ | ✅ | ❌ |\n| Pub/Sub、Sorted Set、Stream | ✅ | ❌ |\n| 多线程 | 单线程 + cluster | 多线程 |\n| 最适合 | 排行榜、会话、复杂结构 | 单纯水平扩存,只读热缓存 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"缓解 RDS 读压力,毫秒查询\" | **ElastiCache Redis**(若题目强调 leaderboard / session / 排行 → 一定 Redis) |\n| \"极简纯缓存、多线程\" | **ElastiCache Memcached** |\n| \"DynamoDB 微秒级读\" | **DAX**(不是 ElastiCache) |\n| \"无服务器缓存、按请求付费\" | **ElastiCache Serverless**(2023 新出) |\n\n## 五、专用数据库 — 一句话记忆\n\n| 服务 | 一句话 | 关键词 |\n|------|--------|--------|\n| **Aurora** | 云原生关系型,RDS 的\"高性能版\" | 5× 性能、Serverless v2、Global DB |\n| **DocumentDB** | MongoDB API 兼容 | JSON 文档、MongoDB 迁移 |\n| **Neptune** | 图数据库 | 社交关系、欺诈检测、知识图谱 |\n| **Timestream** | 时序数据库 | IoT 设备指标、应用监控 |\n| **QLDB** | Ledger 账本,**不可篡改、加密哈希链** | 金融审计、供应链 |\n| **Keyspaces** | Cassandra 兼容 | 已有 Cassandra 应用 |\n| **MemoryDB for Redis** | Redis 兼容,**持久存储级别**(多 AZ 持久) | 主数据库 + Redis 接口 |\n\n### 经典混淆题\n\n| 题目说 | 答案 |\n|--------|------|\n| \"金融交易,不可篡改、加密 hash 校验\" | **QLDB**(不是 DynamoDB) |\n| \"社交网络好友推荐 / 欺诈关系图\" | **Neptune** |\n| \"百万设备每秒上传温度\" | **Timestream** + Kinesis Data Streams |\n| \"已有 MongoDB 应用迁云,不想改代码\" | **DocumentDB** |\n| \"需要 Redis 接口 + 当数据库用(不只是缓存)\" | **MemoryDB**(不是 ElastiCache) |\n\n## 六、数据仓库 & 分析 — Redshift 家族\n\n| 服务 | 何时用 |\n|------|--------|\n| **Redshift** | PB 级分析查询、BI 报表、复杂 SQL |\n| **Redshift Serverless** | 不可预测分析负载 |\n| **Athena** | **直接查询 S3 的 Parquet/CSV/JSON**,无需 ETL |\n| **EMR** | 自管 Spark / Hadoop 集群 |\n| **Glue** | Serverless ETL + Data Catalog |\n| **Lake Formation** | 数据湖权限管理 |\n| **OpenSearch** | 全文搜索、日志分析、Kibana |\n| **QuickSight** | BI 可视化 |\n\n### 关键决策\n\n| 题目说 | 答案 |\n|--------|------|\n| \"查询 S3 里的日志,SQL,无服务器,按查询付费\" | **Athena** |\n| \"PB 级分析 + 跨多表 JOIN\" | **Redshift** |\n| \"实时日志全文搜索 + 仪表板\" | **OpenSearch** |\n| \"Serverless Spark ETL\" | **Glue**(不是 EMR) |\n| \"可视化报表给业务部门\" | **QuickSight** |\n\n## 七、数据迁移 — 简要\n\n| 服务 | 何时用 |\n|------|--------|\n| **DMS**(Database Migration Service) | 数据库 → 数据库迁移(同 / 异构) |\n| **SCT**(Schema Conversion Tool) | Oracle → Aurora 这种**异构 schema 转换** |\n| **DataSync** | 文件级别(NFS/SMB → S3/EFS/FSx) |\n| **Snow 家族** | PB 级离线传输 |\n| **Transfer Family** | SFTP/FTPS/FTP 上传到 S3 |\n\n**陷阱**:\n- 题目说\"Oracle → Aurora MySQL,异构\" → **SCT + DMS**\n- 题目说\"NFS share → S3\" → **DataSync**(不是 DMS)\n- 题目说\"50 TB,带宽差\" → **Snowball Edge**\n\n## 八、自查清单\n\n- [ ] 我能区分 Multi-AZ 和 Read Replica 的目的(可用性 vs 读性能)\n- [ ] 我知道 Aurora Serverless v2 适合什么场景\n- [ ] 我知道为什么 leaderboard 一定是 Redis\n- [ ] 我知道 QLDB 和 DynamoDB 怎么区分\n- [ ] 我知道 Athena vs Redshift 的分界线\n- [ ] 我知道 DMS + SCT 的搭配场景\n\n下一章:[`04-网络架构.md`](04-网络架构.md)\n"}, {"id": "04-网络架构", "title": "04 · 网络架构", "filename": "04-网络架构.md", "content": "# 04 · 网络架构 — ELB / Route 53 / CloudFront / VPC 进阶\n\n> 网络题不一定难,但**陷阱密集**。这章把 ELB 三件套、Route 53 七种路由、CloudFront 与全球加速、VPC 高级互联放在一起。\n\n## 本章先懂这些词\n\n网络题的核心是\"流量从哪里来,要到哪里去,中间经过谁\"。初学者先把公网入口、负载均衡、DNS、缓存、私网互联分开,不要把它们都混成\"网络服务\"。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **DNS** | 把域名解析成地址 | Route 53 |\n| **Load Balancer** | 把流量分给多台后端 | ALB/NLB/GWLB |\n| **L7** | 应用层,看得懂 HTTP 路径和 Header | 路径路由、Host 路由选 ALB |\n| **L4** | 传输层,主要看 TCP/UDP 连接 | 静态 IP、极低延迟、UDP 选 NLB |\n| **CDN** | 把内容缓存到离用户近的边缘节点 | CloudFront |\n| **Origin** | CDN 回源的真实后端 | S3、ALB、EC2、自定义服务器 |\n| **Health Check** | 定期探测后端是否健康 | 故障切换和负载均衡都常用 |\n| **Static IP** | 固定不变的 IP | 常指向 NLB 或 Global Accelerator |\n\n## 一、ELB(Elastic Load Balancer)三件套\n\n```\n                      你的流量是?\n                            │\n   ┌────────────────────────┼─────────────────────────┐\n   │                        │                         │\nHTTP/HTTPS              TCP/UDP                  极致性能\n(L7,7 层)              (L4,4 层)               (低延迟)\n   │                        │                         │\n   ▼                        ▼                         ▼\n  ALB                      NLB                       GWLB\n  Application LB           Network LB                Gateway LB\n                                                    (穿透 3rd-party 设备)\n```\n\n### ALB(Application Load Balancer)\n\n| 特性 | 说明 |\n|------|------|\n| 层级 | L7,基于 HTTP / HTTPS |\n| 路由依据 | 路径(`/api/*`)、Host header、HTTP header、查询参数、IP |\n| 目标类型 | EC2、IP、Lambda、容器 |\n| 高级 feature | WebSocket、HTTP/2、Cognito 集成、redirect/fixed-response、用户认证(OIDC / SAML) |\n| **关键考点** | 题目说 \"**path-based routing**\" / \"**host-based routing**\" / \"**HTTP header**\" / \"**Lambda 作为目标**\" → **ALB** |\n\n### NLB(Network Load Balancer)\n\n| 特性 | 说明 |\n|------|------|\n| 层级 | L4,TCP / UDP / TLS |\n| 性能 | **每秒数百万请求**,毫秒级延迟 |\n| **静态 IP** | ✅ **每个 AZ 一个静态 IP**(或 Elastic IP) |\n| 保留客户端 IP | ✅(自带) |\n| 关键考点 | 题目说 \"**极致 TCP 吞吐 / 静态 IP / UDP / 低延迟**\" → **NLB** |\n\n### GWLB(Gateway Load Balancer)\n\n- L3 透明转发\n- **唯一用途**:接入第三方安全设备(防火墙、IDS/IPS、深度包检测) — 用 GENEVE 协议封装,把流量\"穿\"过虚拟设备再返回\n- 题目说 \"**第三方网络安全设备 / inline traffic inspection**\" → **GWLB**\n\n### CLB(Classic Load Balancer)\n\n- 旧版,新设计不要用 — 但**有些老题**还会出现\n\n### 一张选型表\n\n| 需求 | 选 |\n|------|-----|\n| Web 应用 + 路径路由 | ALB |\n| 微服务 + gRPC + Lambda | ALB |\n| 游戏 / VoIP / IoT(UDP) | NLB |\n| 需要静态 IP / Elastic IP | NLB |\n| 极端吞吐量 | NLB |\n| 跨账号 / 跨 VPC 接入第三方防火墙 | GWLB |\n\n## 二、Auto Scaling Group(ASG)\n\n### Scaling 策略对比\n\n| 策略 | 描述 | 何时用 |\n|------|------|--------|\n| **Target Tracking** | 设定目标值(如 CPU 50%),自动调 | **首选**;最简单 |\n| **Step Scaling** | 分阶段(CPU 60%→+1,80%→+3) | 想精细控制响应曲线 |\n| **Simple Scaling** | 单触发 | 老版,基本不用 |\n| **Scheduled Scaling** | 按时间表(每周一 9 点 +5) | **可预测的周期负载** |\n| **Predictive Scaling** | ML 学习历史,提前 scale | 历史规律明显的应用 |\n\n### ASG 健康检查\n\n- **EC2 检查**(默认)— 实例状态正常即可\n- **ELB 检查** — ALB/NLB 健康检查失败 → ASG 替换 — **生产推荐**\n- **Cooldown** — 防止抖动,默认 300 秒\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"周一上午流量飙升,可预测\" | **Scheduled Scaling** |\n| \"应用挂了但实例 OK,ASG 不替换\" | 把健康检查源切换为 **ELB**,不是 EC2 |\n| \"扩容跟得上突发流量\" | **Target Tracking** + **Warm Pool**(预热实例) |\n| \"无服务器扩容\" | **Lambda** 自动并发 / **Fargate** |\n\n## 三、Route 53 — 不只是 DNS\n\n### 七种路由策略\n\n| 策略 | 一句话 | 何时考 |\n|------|--------|--------|\n| **Simple** | 1 个或多个 IP,客户端轮询 | 最基础 |\n| **Weighted** | 按权重(如 90/10) | **蓝绿 / 灰度发布** |\n| **Latency-based** | 路由到延迟最低的 Region | **全球应用就近访问** |\n| **Geolocation** | 按用户**地理位置** | 合规、本地化内容 |\n| **Geoproximity**(Traffic Flow) | 按地理坐标,**可加 bias** | 需用 Traffic Flow,复杂 |\n| **Failover** | 主备切换(配合健康检查) | DR / 灾备 |\n| **Multi-Value Answer** | 返回多个健康 IP | DNS 级简单负载均衡 |\n\n### 关键考点辨析\n\n| 题目说 | 答案 |\n|--------|------|\n| \"用户从最近的 Region 拿数据\" | **Latency-based** |\n| \"中国用户去 cn 站,日本用户去 jp 站\" | **Geolocation** |\n| \"灰度 / canary,10% 流量到新版本\" | **Weighted**(10/90) |\n| \"主 Region 挂了切到备 Region\" | **Failover** + Route 53 健康检查 |\n| \"蓝绿无停机切换\" | **Weighted** 把权重从 100/0 慢慢切到 0/100 |\n\n### Alias 记录 vs CNAME\n\n| Alias(AWS 专有) | CNAME |\n|------------------|-------|\n| **可指向根域**(apex,如 example.com) | ❌ 只能指向子域 |\n| **指向 AWS 资源**(ALB、CloudFront、S3 网站、API GW) | 任意 DNS |\n| **免费查询** | 收费 |\n\n**记住**:`example.com` 指向 ALB → 必须 **Alias**(CNAME 不允许 root 域)。\n\n## 四、CloudFront — CDN + 边缘安全\n\n### CloudFront 工作流\n\n```\n用户 → Edge Location(缓存命中?)\n           │\n       命中 → 直接返回\n       未命中 ↓\n       Regional Edge Cache(命中?)\n           │\n       未命中 ↓\n       Origin(S3 / ALB / EC2 / 自定义)\n```\n\n### 关键概念\n\n| 概念 | 一句话 |\n|------|--------|\n| **OAC**(Origin Access Control)| 让 S3 桶**只允许 CloudFront 访问**(替代旧的 OAI) |\n| **Signed URL / Signed Cookie** | 限时、受限访问私有内容 |\n| **Lambda@Edge** | 在边缘节点跑 Lambda(请求 / 响应改写) |\n| **CloudFront Functions** | 比 Lambda@Edge 更便宜、更轻,仅 viewer request/response |\n| **Geo Restriction** | 按国家放行 / 拒绝 |\n| **Field-Level Encryption** | 表单字段在边缘加密,后端拿到密文 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"全球静态资源加速 + S3 私有\" | **CloudFront + OAC** + S3 桶策略只接受 OAC |\n| \"动态请求加速 / API 全球加速 + 静态 IP\" | **Global Accelerator**(不是 CloudFront) |\n| \"在 viewer request 改 Host / 重定向 / A-B test\" | **CloudFront Functions** |\n| \"在请求里查 DB / 调 API\" | **Lambda@Edge** |\n| \"限制只允许某些国家访问\" | **CloudFront Geo Restriction** |\n| \"付费视频只给付费用户访问\" | **Signed URL / Signed Cookie** |\n\n### CloudFront vs Global Accelerator — 易混\n\n| 维度 | CloudFront | Global Accelerator |\n|------|------------|--------------------|\n| 主要场景 | **缓存静态内容**(也支持动态) | **加速动态 / TCP UDP** |\n| 协议 | HTTP/HTTPS | TCP/UDP(任意) |\n| IP | 域名 | **2 个 anycast 静态 IP** |\n| 后端切换 | 取决于配置 | **秒级 failover**,健康检查 |\n| 适合 | 视频、网站、API 网关 | 游戏、VoIP、IoT、SaaS 多 Region |\n\n## 五、VPC 进阶 — 互联与流量分析\n\n### 5.1 VPC 之间互通 — 矩阵\n\n| 方案 | 传递性 | 跨账号 | 跨 Region | 成本 |\n|------|--------|--------|-----------|------|\n| **VPC Peering** | ❌ 不传递(A↔B、B↔C ≠ A↔C) | ✅ | ✅ | 数据 |\n| **Transit Gateway** | ✅ **中心辐射,可传递** | ✅ | ✅(TGW Peering) | 小时 + 数据 |\n| **VPC Endpoint Service / PrivateLink** | — | ✅ | ❌(同 Region) | 小时 + 数据 |\n| **AWS Cloud WAN** | ✅ 全球骨干 | ✅ | ✅ | 复杂场景 |\n\n### 5.2 与本地数据中心连接\n\n```\n公司 IDC ─────────┬──── Site-to-Site VPN(几小时上线,加密,带宽看 ISP)\n                  │\n                  ├──── Direct Connect(数周上线,1/10/100 Gbps 专线,不加密)\n                  │\n                  └──── DX + VPN(专线 + 加密 = 高速 + 合规)\n```\n\n| 需求 | 选 |\n|------|-----|\n| 快速、加密、低成本 | **Site-to-Site VPN** |\n| 高带宽、低延迟、稳定 | **Direct Connect** |\n| Direct Connect 也要**加密** | **DX + VPN over DX** |\n| Direct Connect **抗故障**(双线) | **DX with LAG** 或 **2 个 DX location** |\n| 公司端口数有限,连多个 VPC | **DX Gateway**(一个 DX 对接 TGW 或多 VPGW) |\n\n### 5.3 高级流量分析\n\n| 服务 | 一句话 |\n|------|--------|\n| **VPC Flow Logs** | 每条 5-tuple 流量记录,送到 S3 / CloudWatch / Kinesis |\n| **Traffic Mirroring** | **复制**网络包到分析工具(IDS) |\n| **Reachability Analyzer** | 给两个 ENI,告诉你能不能通,卡哪一步 |\n| **Network Access Analyzer** | 找出**违反预期**的可达路径 |\n\n题目说\"调试 EC2 连不上 RDS,要排查路由 / SG / NACL\" → **VPC Reachability Analyzer**。\n\n## 六、自查清单\n\n- [ ] 我能在 1 秒内说出 ALB vs NLB vs GWLB 各用在什么场景\n- [ ] 我知道为什么静态 IP 只能 NLB\n- [ ] 我能列出 Route 53 七种路由策略,各自的典型用法\n- [ ] 我知道根域只能用 Alias 不能 CNAME\n- [ ] 我能区分 CloudFront 和 Global Accelerator\n- [ ] 我知道 PrivateLink 用来\"让消费者跨账号访问我的服务,**不经公网**\"\n- [ ] 我知道 VPN 上线快,Direct Connect 稳定低延迟\n\n下一章:[`05-计算服务选型.md`](05-计算服务选型.md)\n"}, {"id": "05-计算服务选型", "title": "05 · 计算服务选型", "filename": "05-计算服务选型.md", "content": "# 05 · 计算服务选型 — EC2 / Lambda / 容器\n\n> SAA 计算题主要问\"在 EC2、Lambda、ECS、Fargate、Batch 之间挑哪个\",且常常和**成本 + 弹性 + 运维负担**绑定问。\n\n## 本章先懂这些词\n\n计算服务就是\"代码在哪里运行\"。选型时先判断你想管到哪一层:自己管虚拟机选 EC2,只交函数选 Lambda,交容器但不管服务器选 Fargate。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **Workload** | 一段要运行的业务负载 | Web 服务、批处理、API、定时任务 |\n| **Instance** | 一台云上虚拟机 | EC2 的基本单位 |\n| **Serverless** | 不直接管理服务器 | Lambda、Fargate、DynamoDB 常见 |\n| **Container** | 把应用和依赖打包成镜像运行 | ECS / EKS / Fargate |\n| **Launch type** | 容器跑在哪里 | EC2 launch type 自管节点,Fargate 不管节点 |\n| **Concurrency** | 同时运行多少个请求/函数 | Lambda 并发题高频 |\n| **Cold start** | 函数一段时间没跑,首次启动变慢 | Provisioned Concurrency / SnapStart |\n| **IaC** | 用代码描述基础设施 | CloudFormation、CDK、Terraform |\n\n## 一、第一性决策树\n\n```\n                你的工作负载?\n                       │\n   ┌───────────────────┼────────────────────────┐\n   │                   │                        │\n长期稳定 / 老应用    短小 + 事件触发        容器化\n   │                   │                        │\n   ▼                   ▼                        ▼\n  EC2               Lambda                    ECS / EKS\n                                    ┌──────────┴──────────┐\n                                    │                     │\n                                  Fargate              EC2 launch type\n                              (无服务器容器)         (自管节点)\n```\n\n## 二、EC2 实例族 — 不用背全部\n\n只要记**字母前缀**:\n\n| 字母 | 含义 | 何时选 |\n|------|------|--------|\n| **M** | General(通用) | 默认选项,Web / 应用服务器 |\n| **C** | Compute optimized | CPU 密集:批处理、编码、机器学习推理 |\n| **R** | Memory optimized | 内存数据库、内存分析 |\n| **X / z** | 大内存 | SAP HANA、大型内存数据库 |\n| **I / D** | Storage(SSD/HDD)| NoSQL、Hadoop、本地高 IOPS |\n| **P / G / Inf / Trn** | GPU / 加速器 | 机器学习、图形 |\n| **T** | Burstable(突发) | 间歇负载,基线 + 突发额度,**便宜**;**长期跑满会被节流** |\n| **A** | Graviton(ARM) | **20%–40% 性价比**,新选择 |\n\n数字后缀(t2 → t3 → t4g):**越大越新**,几乎总是用最新一代更省钱。\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"便宜 + ARM + 兼容 Linux\" | Graviton(**a / g** 系列,如 m6g、t4g) |\n| \"突发 CPU,平时低负载\" | **T 系列**(t3 / t4g) |\n| \"高内存数据库\" | **R / X / z** 系列 |\n| \"高 IOPS 本地 NVMe\" | **I 系列** + Instance Store |\n| \"GPU 训练\" | **P / Trn**(训练专用) |\n| \"GPU 推理\" | **G / Inf** |\n\n## 三、EC2 计费模式 — 必背\n\n| 模式 | 折扣 | 承诺 | 何时用 |\n|------|------|------|--------|\n| **On-Demand** | 0 | 无 | 短期、不稳定,刚搭建 |\n| **Savings Plans**(Compute / EC2 / SageMaker) | 最高 72% | 1/3 年承诺 $/小时 | **首选**,涵盖 EC2/Lambda/Fargate |\n| **Reserved Instances** | 最高 72% | 1/3 年承诺**特定实例族 + Region** | 老办法,新项目用 Savings Plans |\n| **Spot** | 最高 90% | 无,**可被回收**(2 分钟通知) | **容错任务**:批处理、CI、ML 训练、无状态 web |\n| **Dedicated Host** | — | 物理机隔离 | License 绑定(Windows、Oracle) |\n| **Dedicated Instance** | — | 物理隔离但不需要主机可见性 | 合规要求 |\n| **Capacity Reservations** | 0 | 预留容量,**保证可用** | 重要任务,即使不打折 |\n\n### Savings Plans 三个 flavor\n\n| 类型 | 范围 | 折扣 |\n|------|------|------|\n| **Compute Savings Plan** | **最灵活**:跨 EC2/Lambda/Fargate,任意 Region/实例族 | 最高 66% |\n| **EC2 Instance Savings Plan** | 锁定实例族 + Region | 最高 72% |\n| **SageMaker Savings Plan** | SageMaker 实例 | — |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"可容忍中断、便宜\" | **Spot** |\n| \"稳定 3 年负载,最大折扣\" | **EC2 Instance SP**(3 年 + all upfront) |\n| \"Lambda + Fargate + EC2 都想打折\" | **Compute Savings Plan** |\n| \"BYOL Windows / Oracle\" | **Dedicated Host** |\n| \"保证有容量但不需折扣\" | **On-Demand Capacity Reservation** |\n\n## 四、Spot Instances 深入\n\n### 中断行为\n\n- **2 分钟通知**(via instance metadata + EventBridge)\n- 中断后:Stop / Hibernate / Terminate(可配置)\n- **Spot Fleet** / **Spot Block**(已弃)/ **EC2 Fleet**:混搭 Spot + On-Demand\n\n### 适合 / 不适合\n\n| 适合 | 不适合 |\n|------|--------|\n| 无状态 web(配合 ASG + ALB) | 单点数据库主节点 |\n| 批处理、CI、视频转码 | 长事务、不可恢复任务 |\n| ML 训练(checkpoint) | 短临时但绝对不能中断 |\n| 容器 Worker(EKS/ECS) | — |\n\n## 五、Lambda — 函数即服务\n\n### 关键限额(必背 — SAA 高频)\n\n| 限额 | 值 |\n|------|---|\n| 单次执行最长 | **15 分钟** |\n| 内存 | 128 MB – 10,240 MB |\n| /tmp 临时空间 | **512 MB – 10,240 MB**(可配) |\n| 部署包(zip)| 50 MB(直传)/ 250 MB(unzip)|\n| 镜像 | **最大 10 GB** |\n| 并发(账号 / Region) | 默认 1000,可申请提高 |\n| 环境变量 | 4 KB |\n| Payload(请求 / 响应) | 同步 6 MB / 异步 256 KB |\n\n### 触发器分类\n\n| 类型 | 例子 |\n|------|------|\n| 同步 | API Gateway、ALB、Cognito |\n| 异步 | S3 事件、SNS、EventBridge |\n| 流 / Poll | DynamoDB Streams、Kinesis、SQS、MSK |\n\n### 并发控制\n\n| 概念 | 说明 |\n|------|------|\n| **Reserved Concurrency** | 锁定该函数最多 N 并发 |\n| **Provisioned Concurrency** | **预热 N 个实例**,消除冷启动 |\n| **Lambda SnapStart**(Java)| 启动时间从秒级到毫秒级 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"处理时间 < 15 分钟、按调用付费\" | **Lambda** |\n| \"处理时间 > 15 分钟 / 长任务\" | **Fargate** / **Batch** / **ECS** |\n| \"Lambda 第一次响应慢(冷启动)\" | **Provisioned Concurrency**(或 SnapStart 对 Java) |\n| \"Java Lambda 冷启动\" | **SnapStart** |\n| \"Lambda 想用大临时空间\" | **/tmp 提高到 10 GB**(2022 新增) |\n| \"Lambda 容器镜像\" | 镜像可达 **10 GB**(zip 仅 250 MB) |\n\n## 六、容器服务 — ECS / EKS / Fargate\n\n### 矩阵\n\n|  | 控制面 | 数据面(节点) |\n|---|--------|---------------|\n| **ECS on EC2** | AWS 托管 ECS | 你自管 EC2 |\n| **ECS on Fargate** | AWS 托管 ECS | **AWS 托管,无服务器** |\n| **EKS on EC2** | AWS 托管 K8s API | 你自管 EC2 |\n| **EKS on Fargate** | AWS 托管 K8s API | **AWS 托管,无服务器** |\n\n### 选择套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"无 Kubernetes 经验、AWS 原生\" | **ECS** |\n| \"已有 Kubernetes / 多云迁移\" | **EKS** |\n| \"完全无服务器、不想管节点\" | **Fargate**(配 ECS 或 EKS) |\n| \"需要 GPU + 高度定制\" | **EC2 launch type** |\n| \"Lambda 容器但要超过 15 分钟\" | **Fargate** |\n\n### App Runner\n\n- 一行命令把容器变成生产 URL,**完全托管**\n- 比 Fargate 更简化,适合 \"PaaS 风格\" 微服务\n- 题目说\"最少配置部署容器化 Web 应用 + HTTPS + 自动扩展\" → **App Runner**\n\n## 七、批处理 — AWS Batch\n\n- 用于**大规模容器化批任务**调度\n- 可跑在 EC2 / Fargate / Spot\n- 自动算需要多少机器、跑完释放\n- 题目说\"科学计算 / 视频转码批量任务\" → **AWS Batch**(配 Spot)\n\n## 八、Elastic Beanstalk vs CloudFormation vs SAM vs CDK\n\n| 工具 | 抽象层级 | 何时用 |\n|------|----------|--------|\n| **Elastic Beanstalk** | 一键部署 web 应用,**底层 EC2+ASG+ELB+RDS** | 想快速上线 + 不想管基础设施 |\n| **CloudFormation** | IaC,YAML/JSON 描述 stack | **AWS 原生 IaC 首选** |\n| **SAM**(Serverless Application Model)| CloudFormation 的 serverless 简化版 | Lambda / API GW 应用 |\n| **CDK**(Cloud Development Kit)| 用 Python/TS/Java 写 IaC,最终编译成 CFN | 程序员友好的 IaC |\n| **Terraform** | 第三方,跨云 | 多云环境 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"把代码丢给 AWS,自动起 web 应用\" | **Elastic Beanstalk** |\n| \"IaC,AWS 原生\" | **CloudFormation** 或 **CDK** |\n| \"Serverless 应用 IaC,简化\" | **SAM** |\n| \"跨 AWS / Azure 的 IaC\" | **Terraform** |\n\n## 九、Step Functions — 工作流编排\n\n- 把多个 Lambda / ECS / Batch / 等服务串成状态机\n- **2 种类型**:\n  - **Standard**:最长 1 年,**精确一次**,贵\n  - **Express**:最长 5 分钟,**至少一次**,**100K/秒**,便宜\n- 题目说\"长流程、可视化、错误重试\" → **Step Functions**\n- 题目说\"高 QPS 短流程(IoT、事件处理)\" → **Step Functions Express**\n\n## 十、自查清单\n\n- [ ] 我能 30 秒说出何时选 Lambda vs Fargate vs EC2\n- [ ] 我能区分 Spot / Savings Plan / Reserved / On-Demand 何时用\n- [ ] 我知道 Lambda 最长 15 分钟,超过用 Fargate / Batch\n- [ ] 我知道 Compute Savings Plan 比 EC2 Instance SP 更灵活但折扣略低\n- [ ] 我能区分 Step Functions Standard vs Express\n- [ ] 我知道 App Runner 是给最简单的 web 容器用的\n\n下一章:[`06-解耦与事件驱动.md`](06-解耦与事件驱动.md)\n"}, {"id": "06-解耦与事件驱动", "title": "06 · 解耦与事件驱动", "filename": "06-解耦与事件驱动.md", "content": "# 06 · 解耦与事件驱动 — SQS / SNS / EventBridge / Kinesis / MSK\n\n> \"应用 A 直接调用应用 B\" 是 SAA 题里的反模式。每次出现\"前端忙不过来 / 一个挂了影响所有 / 突发流量打挂\",答案都是 — **加一个解耦层**。\n\n## 本章先懂这些词\n\n解耦的意思是:不要让服务 A 必须等服务 B 立刻成功。中间放队列、主题或事件总线,可以削峰、重试、隔离故障。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **Producer** | 生产消息的一方 | Web/API/Lambda 把任务放出去 |\n| **Consumer** | 消费消息的一方 | Worker/Lambda 慢慢处理任务 |\n| **Queue** | 队列,一条消息通常给一个消费者处理 | SQS |\n| **Topic** | 主题,一条消息广播给多个订阅者 | SNS |\n| **Pub/Sub** | 发布/订阅模式 | 一对多通知 |\n| **Fan-out** | 一个事件分发给多个下游 | SNS -> 多个 SQS |\n| **Idempotency** | 重复执行也不会造成错误结果 | SQS Standard 可能重复,应用要能处理 |\n| **Replay** | 重新读取历史事件 | Kinesis / EventBridge Archive 高频 |\n\n## 一、第一性决策树\n\n```\n                你需要怎么传消息?\n                       │\n   ┌───────────────────┼───────────────────────────┐\n   │                   │                           │\n点对点队列         一对多扇出                   实时流式数据\n(消费后删)        (订阅者收)                   (重放、多消费者)\n   │                   │                           │\n   ▼                   ▼                           ▼\n  SQS                SNS                       Kinesis / MSK\n                                       ┌──────────┴──────────┐\n                                       Data Streams       Data Firehose\n                                     (实时 + 重放)      (实时 → S3/Redshift)\n                              事件驱动调度\n                                   ↓\n                              EventBridge\n                              (跨服务、SaaS、规则匹配)\n```\n\n## 二、SQS — 简单消息队列\n\n### 两种类型\n\n| 类型 | 顺序 | 去重 | 吞吐 | 何时用 |\n|------|------|------|------|--------|\n| **Standard** | 不保证 | **可能重复**(at-least-once) | **无限** | 默认,削峰、异步 |\n| **FIFO** | **严格按序**(按 Group ID) | **去重**(5 分钟窗口) | **300 TPS / 3000 TPS w/ batch** | 顺序关键、不可重复 |\n\n### 关键参数\n\n| 参数 | 默认 | 说明 |\n|------|------|------|\n| **Visibility Timeout** | 30 秒 | 消息被取出后,多久内不再可见 |\n| **Message Retention** | 4 天 | 最长 14 天 |\n| **Delivery Delay** | 0 | 最长 15 分钟 |\n| **Long Polling** | 关闭 | **开启**减少空轮询费用,推荐 |\n| **DLQ**(Dead Letter Queue)| — | N 次失败转到 DLQ,人工 / 自动处理 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"削峰、异步、消费者用完删除\" | **SQS Standard** |\n| \"**顺序、唯一**(转账)\" | **SQS FIFO** |\n| \"消费失败后重试有限次再隔离\" | DLQ |\n| \"消费者用一会儿才能处理完一条\" | **延长 Visibility Timeout** |\n| \"Lambda 消费 SQS 怎么扩展\" | Lambda **event source mapping** 自动 poll,SQS Standard 可达千并发 |\n\n## 三、SNS — Pub/Sub 扇出\n\n- **Topic** → 多个 **Subscriber**(Lambda、SQS、HTTP、Email、SMS、Mobile push)\n- **不存储**消息(SQS 才存),订阅者必须在线或者把 SNS 推到 SQS 暂存\n- **FIFO Topic**:配合 SQS FIFO 实现**有序广播**\n\n### 经典模式:Fan-Out\n\n```\n              ┌─→ SQS Queue (Email service)\nSNS Topic ───┼─→ SQS Queue (Analytics)\n              └─→ SQS Queue (Notification)\n              └─→ Lambda\n```\n\n订单事件 → SNS → 多个 SQS 队列,每个下游独立消费,**互不影响**。\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"一个事件多个消费者各自处理\" | **SNS → 多个 SQS**(fan-out)|\n| \"短信 / 邮件 / 推送通知\" | **SNS** 直接订阅 |\n| \"**保证消息不丢**\" + \"**一对多**\" | SNS + 多个 **SQS**(SQS 持久化) |\n| \"过滤订阅(只接受某属性的消息)\" | **SNS Message Filtering** |\n\n## 四、EventBridge — 事件总线(更高级)\n\n| 维度 | EventBridge | SNS |\n|------|-------------|-----|\n| 模式 | 基于**事件规则**(JSON pattern matching) | 主题订阅 |\n| Schema 注册 | ✅ Schema Registry | ❌ |\n| 第三方 SaaS 集成 | ✅(Datadog、Zendesk、Shopify…)| ❌ |\n| Replay | ✅(Archive + Replay)| ❌ |\n| 自定义事件总线 | ✅ | — |\n| 适合 | **事件驱动架构**、跨服务、SaaS 集成 | 简单广播 / 通知 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"S3/EC2/任意 AWS 服务事件 → 触发动作\" | **EventBridge** + 规则 |\n| \"定时触发 Lambda(cron)\" | **EventBridge Scheduler**(或老的 CloudWatch Events)|\n| \"第三方 SaaS 产生事件,触发 AWS 内部\" | **EventBridge SaaS partner** |\n| \"把过去事件重放\" | **EventBridge Archive + Replay** |\n\n## 五、Kinesis — 实时流式数据\n\n### 家族成员\n\n| 服务 | 一句话 |\n|------|--------|\n| **Kinesis Data Streams**(KDS) | 实时 + **可重放**(默认 24 小时,最长 365 天) |\n| **Kinesis Data Firehose** | 实时 **→ 目的地**(S3 / Redshift / OpenSearch / 第三方);**无服务器、buffer & flush** |\n| **Kinesis Data Analytics**(已改名 **Amazon Managed Service for Apache Flink**) | 流式 SQL / Flink 处理 |\n| **Kinesis Video Streams** | 视频流入云 |\n\n### KDS vs Firehose — 关键区别\n\n| 维度 | KDS | Firehose |\n|------|-----|----------|\n| 数据保留 | 24 小时–365 天 | **不保留**(即时投递) |\n| 处理 | 多个消费者并行读 + 重放 | 自动投递到目的地 |\n| 延迟 | 毫秒 | **buffer 后 60 秒最低** |\n| 扩展 | 按 **Shard** 数 | **完全自动** |\n| 适合 | 实时分析、多消费者 | 数据入湖 / 入仓 |\n\n### Kinesis vs SQS — 易混\n\n| 维度 | Kinesis | SQS |\n|------|---------|-----|\n| 顺序 | 按 partition key | FIFO 模式才有序 |\n| 重放 | ✅ 默认 | ❌(删了就没了) |\n| 多消费者并行同份数据 | ✅ | ❌(每条只一个消费者) |\n| 适合 | **流式分析、CDC、日志** | **任务队列** |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"IoT 设备每秒百万事件 + 实时分析\" | **KDS + Flink + (Firehose → S3)** |\n| \"应用日志实时入 S3/Redshift\" | **Firehose** |\n| \"处理顺序 + 可重放\" | **KDS**(按 partition key) |\n| \"顺序但不需要重放\" | **SQS FIFO** |\n| \"实时流式视频分析\" | **Kinesis Video Streams + Rekognition** |\n\n## 六、MSK — Managed Kafka\n\n- 已有 Kafka 应用迁云 / Kafka 生态(Connect、KSQL、Schema Registry)→ **MSK**\n- **MSK Serverless**:无脑扩展\n- 不要把 MSK 当 KDS 的替代品考 — 题目里\"已有 Kafka 经验\" / \"Kafka 客户端\" 出现才选\n\n## 七、Step Functions(也算编排,与 06 章联动)\n\n详见 [`05-计算服务选型.md` 第九节](05-计算服务选型.md)。  \n当流程涉及**多个步骤、有 if/else、重试、人工干预**时 → **Step Functions**。\n\n## 八、混合编排模式 — SAA 常考的\"组合拳\"\n\n### 模式 1:订单处理(削峰 + 扇出)\n\n```\nWeb 前端 ──→ API Gateway ──→ Lambda ──→ SNS ──┬──→ SQS → 库存服务\n                                              ├──→ SQS → 邮件服务\n                                              └──→ SQS → 分析服务\n```\n\n### 模式 2:IoT 数据管道\n\n```\nIoT 设备 ──→ Kinesis Data Streams ──→ Flink (实时聚合)\n                  │\n                  └──→ Firehose ──→ S3 (数据湖)\n                                       ↓\n                                    Athena / Glue / Redshift\n```\n\n### 模式 3:跨服务事件总线\n\n```\nS3 事件 ──┐\nEC2 事件 ─┼──→ EventBridge ──┬──→ Lambda\nRDS 事件 ─┘                   ├──→ Step Functions\nSaaS 事件 ────────────────────┘\n```\n\n## 九、自查清单\n\n- [ ] 我能区分 SQS Standard vs FIFO 何时用\n- [ ] 我知道 SNS → 多个 SQS 是**经典 fan-out 模式**\n- [ ] 我能说出 Visibility Timeout 解决什么问题\n- [ ] 我知道 EventBridge 比 SNS 多了什么(规则 / SaaS / Archive)\n- [ ] 我能区分 KDS vs Firehose 何时用\n- [ ] 我知道 Kinesis 比 SQS 多了\"可重放 + 多消费者\"\n- [ ] 我能画出一个标准订单系统的解耦图\n\n下一章:[`07-监控与运维.md`](07-监控与运维.md)\n"}, {"id": "07-监控与运维", "title": "07 · 监控与运维", "filename": "07-监控与运维.md", "content": "# 07 · 监控与运维 — CloudWatch / CloudTrail / Config / Systems Manager\n\n> \"**谁做了什么?**\" → CloudTrail。  \n> \"**资源状况怎样?**\" → CloudWatch。  \n> \"**配置合不合规?**\" → Config。  \n> \"**怎么远程操作?**\" → Systems Manager。\n\n## 本章先懂这些词\n\n监控与运维题常在问四件事:有没有异常、谁造成的、配置是否合规、怎么自动处理。把这四个问题分开,CloudWatch / CloudTrail / Config / SSM 就不会混。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **Metric** | 数字型指标,随时间变化 | CPU、错误率、延迟 |\n| **Log** | 文本日志 | 应用报错、访问记录 |\n| **Alarm** | 指标越界后的告警动作 | 触发 SNS、ASG、Lambda |\n| **Audit** | 审计,追踪谁做了什么 | CloudTrail |\n| **Configuration** | 资源配置状态 | Config 记录 S3 是否加密、SG 是否开放 |\n| **Compliance** | 是否符合规则/法规/公司标准 | Config Rules、Audit Manager |\n| **Runbook** | 运维处理流程 | SSM Automation 自动执行 |\n| **Agent** | 安装在机器里的采集/执行程序 | CloudWatch Agent、SSM Agent |\n\n## 一、CloudWatch — 监控与日志\n\n### 三大组件\n\n| 组件 | 一句话 |\n|------|--------|\n| **Metrics** | 时间序列数据(CPU、磁盘、自定义) |\n| **Logs** | 应用 / 系统日志 |\n| **Alarms** | 监控 metric 越界 → 触发 SNS / Auto Scaling |\n\n### Metrics 关键概念\n\n| 概念 | 说明 |\n|------|------|\n| **Standard Resolution** | 60 秒粒度,免费 |\n| **High Resolution** | 1 秒粒度,**收费**,适合关键应用 |\n| **Custom Metrics** | 应用埋点,通过 SDK / agent 上报 |\n| **Detailed Monitoring** | EC2 默认 5 分钟;开启后 1 分钟 |\n| **Metric Filter** | 从日志里提取数字作为 metric(如 ERROR 出现次数)|\n| **Metric Math** | 对多个 metric 算术(如错误率 = 4xx / total)|\n\n### Logs 关键概念\n\n| 概念 | 说明 |\n|------|------|\n| **Log Group** | 一组 Log Stream(如某个 Lambda 函数) |\n| **Log Stream** | 单一来源(如某个容器实例) |\n| **Subscription Filter** | 实时把日志流到 Kinesis / Lambda / Firehose |\n| **Logs Insights** | SQL-like 查询语言,临时分析 |\n| **Live Tail** | 实时查看日志(2023 新增) |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"EC2 把内存使用率上报\" | **安装 CloudWatch Agent**(内存不是默认 metric) |\n| \"Lambda 错误率监控并告警\" | CW Metric `Errors` + Alarm + SNS |\n| \"应用日志中\"ERROR\"出现 5 次 / 5 分钟告警\" | **Metric Filter** → 自定义 metric → Alarm |\n| \"实时把日志送到 OpenSearch\" | **CloudWatch Logs Subscription Filter** → Kinesis Data Streams / Firehose → OpenSearch |\n| \"长期归档应用日志\" | Logs → **export to S3** 或直接 Firehose → S3,并设 lifecycle |\n\n### Alarms 状态\n\n- `OK` / `ALARM` / `INSUFFICIENT_DATA`\n- **Composite Alarm**:多个 alarm AND/OR 组合,减少误报\n\n## 二、CloudTrail — 谁做了什么\n\n### 三种事件类型\n\n| 类型 | 默认开启 | 说明 |\n|------|----------|------|\n| **Management Events** | ✅ | 控制台 / API 调用(如 RunInstance、CreateBucket) |\n| **Data Events** | ❌(要付费开)| 数据级(S3 object read/write、Lambda invoke) |\n| **Insights Events** | ❌ | ML 检测异常 API 活动 |\n\n### 关键考点\n\n- **默认保留 90 天**(在 CloudTrail 控制台 Event History)。要更久 → **新建 Trail** 把事件送到 **S3**。\n- **多 Region Trail**:一个 trail 收集**所有 Region** 的事件,**强烈推荐**。\n- **Organizations Trail**:在 Management Account 启用,**收集所有成员账号**,成员无法关闭。\n- 题目说\"防止账号管理员删 trail / 隐藏行迹\" → **Organizations Trail + S3 Object Lock** + CloudTrail log file validation。\n\n### CloudTrail vs CloudWatch — 易混\n\n| 维度 | CloudTrail | CloudWatch |\n|------|------------|------------|\n| 数据 | API 调用 / 审计 | 性能 metric / 日志 |\n| 关键问题 | \"谁 / 什么时候 / 做了什么\" | \"状况怎么样\" |\n| 题目关键词 | **audit、who、API call、compliance** | **CPU、metric、threshold、alarm** |\n\n## 三、AWS Config — 配置合规\n\n### 核心概念\n\n```\n   Resource 状态变化\n        │\n        ▼\n   Configuration Item(快照)\n        │\n   ┌────┴──────┐\n   ▼           ▼\n Timeline    Rules (评估合规)\n            (managed / custom)\n            ┌──────────────┐\n            ▼              ▼\n        Compliant      Non-compliant\n                           │\n                           ▼\n                     Remediation(自动修复,SSM Automation)\n```\n\n### 关键能力\n\n| 能力 | 一句话 |\n|------|--------|\n| **Configuration History** | 每次资源变化的快照,任意时间点查询 |\n| **Conformance Pack** | 一组规则模板(PCI、HIPAA、CIS)|\n| **Aggregator** | 跨账号 / Region 集中合规视图 |\n| **Auto-Remediation** | 不合规自动修(关联 SSM Automation 文档)|\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"检查所有 S3 桶是否启用了加密\" | **Config Rule**(managed: `s3-bucket-server-side-encryption-enabled`)|\n| \"自动修复:S3 桶被设为 public 时关掉\" | Config + **SSM Automation** |\n| \"跨账号合规仪表板\" | **Config Aggregator** |\n| \"证明在过去某时刻资源 X 的状态\" | **Config Timeline** |\n\n### CloudTrail vs Config — 易混(超高频)\n\n| 维度 | CloudTrail | Config |\n|------|------------|--------|\n| 关心 | **动作**(谁调了 API)| **状态**(资源当下长什么样)|\n| 时序 | 事件流 | 状态快照 + 历史 |\n| 题目关键词 | who、API、audit | configuration、compliant、changed |\n\n## 四、Systems Manager(SSM)— 运维瑞士军刀\n\n### 必背组件\n\n| 组件 | 一句话 | 何时考 |\n|------|--------|--------|\n| **Parameter Store** | 配置参数(纯文本或 SecureString) | 题目说\"存配置 / API key,免费\" |\n| **Secrets Manager** | 凭证 + **自动轮换** | 题目说\"DB 密码自动轮换\" |\n| **Session Manager** | 浏览器 / CLI **登录 EC2,无需 SSH/22 端口** | 题目说\"私有子网 EC2 不开 22,要登录\" |\n| **Run Command** | 在数千台 EC2 同时跑脚本 | 批量补丁、运维命令 |\n| **Patch Manager** | 自动补丁 | OS 补丁合规 |\n| **Automation** | 运维 runbook(YAML 流程) | 自动修复、定期任务 |\n| **State Manager** | 把实例拉回期望状态 | 持续合规 |\n| **Inventory** | 软件清单 | 资产管理 |\n| **OpsCenter** | 集中运维问题面板 | — |\n\n### Parameter Store vs Secrets Manager\n\n| 维度 | Parameter Store | Secrets Manager |\n|------|-----------------|-----------------|\n| 价格 | **免费**(SecureString 用 KMS 收 KMS 费) | **付费**($0.4/secret/月) |\n| 自动轮换 | ❌(自己写) | ✅ **内置 RDS / Redshift / DocumentDB** |\n| 跨账号共享 | ✅ | ✅ |\n| 复制到其他 Region | ❌ | ✅ |\n| 容量上限 | 标准 4 KB,高级 8 KB | 64 KB |\n\n**陷阱**:题目说\"**RDS 密码自动每 30 天轮换**\" → **Secrets Manager**(不是 Parameter Store)。\n\n### Session Manager — 必背场景\n\n- **私有子网** EC2,**无 22 端口**,**无 bastion host**,通过控制台/CLI 登录\n- 不需要 SSH key,审计 / 日志可送到 CloudWatch / S3\n- 题目关键词:**\"no inbound port\"、\"no SSH key management\"、\"audit logging\"**\n\n## 五、Trusted Advisor — 自动巡检\n\n5 个维度免费 / Premium 全开(Business 以上):\n\n- 成本优化\n- 性能\n- 安全(MFA、Open Security Group)\n- 容错(Multi-AZ?)\n- 服务限制(Service Quota)\n\n题目说\"自动检查是否有公网 22 端口 / 未开 MFA 用户\" → **Trusted Advisor**(也可以 Config / Inspector)。\n\n## 六、AWS Health Dashboard\n\n- **Service Health**:AWS 全局服务状态(所有用户都看得到)\n- **Personal Health**(原 Personal Health Dashboard):**只影响你账号的事件**(维护、计划性中断)\n- 可以 EventBridge 触发 Lambda 自动响应\n\n## 七、综合监控架构 — SAA 经典图\n\n```\n应用日志 ── CloudWatch Agent ──→ CW Logs\nEC2 metric ── 默认 ──→ CW Metrics\nAPI 调用 ──→ CloudTrail ──→ S3 + Athena 查\n资源状态 ──→ Config ──→ Aggregator\n            │\n            ├──→ Alarm ──→ SNS ──→ Email / Lambda / ASG\n            │\n            └──→ EventBridge ──→ 自动化(Step Functions / SSM)\n```\n\n## 八、自查清单\n\n- [ ] 我能在题目里 1 秒区分 CloudTrail / CloudWatch / Config\n- [ ] 我知道 Logs Insights 是 SQL 查询,Metric Filter 是日志转 metric\n- [ ] 我知道 Secrets Manager 才有内置自动轮换\n- [ ] 我知道私有 EC2 登录用 Session Manager,不需要开 22\n- [ ] 我能说出 Config Aggregator 用来干嘛\n- [ ] 我知道 CloudTrail 默认 90 天,要更久要 S3 trail\n\n下一章:[`08-安全与合规.md`](08-安全与合规.md)\n"}, {"id": "08-安全与合规", "title": "08 · 安全与合规", "filename": "08-安全与合规.md", "content": "# 08 · 安全与合规 — IAM / KMS / WAF / Shield / GuardDuty / Inspector / Macie\n\n> **Domain 1 占 30% 权重,SAA 第一大主题**。这一章先深入 IAM,再串联 9 个安全服务。\n\n## 本章先懂这些词\n\n安全题不要只背服务名,先拆成\"谁想对什么资源做什么动作,是否允许,数据有没有被保护,异常能不能被发现\"。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **Principal** | 发起请求的人或服务 | IAM User、Role、AWS Service |\n| **Action** | 想做的动作 | `s3:GetObject`、`ec2:RunInstances` |\n| **Resource** | 被访问的对象 | S3 bucket、KMS key、DynamoDB table |\n| **Policy** | 权限规则 | Allow / Deny 谁能做什么 |\n| **Explicit Deny** | 明确拒绝 | 永远优先于 Allow |\n| **Trust Policy** | 谁可以扮演这个 Role | 跨账号 AssumeRole 高频 |\n| **Encryption at rest** | 数据落盘后加密 | S3/EBS/RDS/KMS |\n| **Encryption in transit** | 网络传输中加密 | TLS/HTTPS/VPN |\n\n## 一、IAM 深入\n\n### 1.1 Policy 评估逻辑(必背)\n\n```\n有 explicit DENY?  ──→ 拒绝\n       │\n       ▼ no\nSCP 允许?(成员账号)  ──→ no → 拒绝\n       │\n       ▼ yes\nPermission Boundary 允许?  ──→ no → 拒绝\n       │\n       ▼ yes\nSession Policy 允许?  ──→ no → 拒绝\n       │\n       ▼ yes\nIdentity Policy / Resource Policy 有 ALLOW?  ──→ no → 隐式拒绝\n       │\n       ▼ yes\n   → 允许\n```\n\n**口诀**:**显式拒绝总赢;没有显式允许 = 隐式拒绝。**\n\n### 1.2 五种 Policy 类型\n\n| 类型 | 附加在 | 用途 |\n|------|--------|------|\n| **Identity-based** | User / Group / Role | 给身份什么权限 |\n| **Resource-based** | S3 桶 / SQS / SNS / KMS 等 | 谁能访问这个资源 |\n| **Permission Boundary** | User / Role | **上限**,即使 identity policy 给了也不能超过 |\n| **SCP**(Service Control Policy) | OU / Account | 整个账号的上限 |\n| **Session Policy** | STS AssumeRole 临时会话 | 临时缩权 |\n\n### 1.3 IAM Role 关键场景\n\n| 场景 | 配置 |\n|------|------|\n| EC2 访问 S3 | **Instance Profile**(包装一个 Role) |\n| Lambda 访问 DynamoDB | Lambda **Execution Role** |\n| 跨账号访问 | A 账号的 Role 设 Trust Policy 信任 B 账号 → B 用户 AssumeRole |\n| 联邦企业 AD 登录 AWS | **Identity Center**(原 SSO) + SAML → 自动 AssumeRole |\n| Mobile / Web 应用 | **Cognito Identity Pools** → 临时凭证 |\n\n### 1.4 关键工具\n\n| 工具 | 一句话 |\n|------|--------|\n| **IAM Access Analyzer** | 找出**外部访问**的资源(桶、role、KMS key 等被外人用) |\n| **Last Accessed** | 显示 user/role/policy 何时最后使用,**清理过度权限** |\n| **Credential Report** | CSV 报告:所有用户的 MFA / 密码 / 密钥状态 |\n| **Policy Simulator** | 模拟\"这个用户能否调 X API\" |\n\n### 1.5 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"EC2 上的应用要访问 S3,**不要写凭证**\" | **IAM Role 附到 EC2**(Instance Profile) |\n| \"防止开发者把自己 Role 提升到 admin\" | **Permission Boundary** |\n| \"整个 OU 不能开 us-east-2\" | **SCP** Deny by `aws:RequestedRegion` |\n| \"外部用户能不能访问我们的 S3?\" | **IAM Access Analyzer** |\n| \"清理过期权限\" | **Last Accessed** + 移除策略 |\n| \"PowerUser 但**不能**改 IAM\" | AWS managed `PowerUserAccess` |\n\n## 二、KMS — 加密密钥管理\n\n### Key 类型\n\n| 类型 | 谁管 | 何时用 |\n|------|------|--------|\n| **AWS Owned Key** | AWS 完全管,你看不到 | 默认 S3 加密(SSE-S3) |\n| **AWS Managed Key**(aws/…)| 部分管 | RDS 默认加密 |\n| **Customer Managed Key**(CMK)| **你管** | 自定义旋转、跨账号、key policy |\n\n### Symmetric vs Asymmetric\n\n| 用途 | Key 类型 |\n|------|----------|\n| 加解密**数据**(默认) | Symmetric(AES-256) |\n| 数字签名 / 验签 | Asymmetric(RSA / ECC) |\n| HMAC | Symmetric HMAC |\n\n### Key Policy + Grants\n\n- **Key Policy**:谁可以用 / 管这把 key(类似 resource policy)\n- **Grant**:临时授权一段时间,适合 Lambda / EC2 临时用 key\n- **必须**在 Key Policy 里有人有 `kms:*` 才能管它(否则 key 锁死)\n\n### Envelope Encryption(必懂概念)\n\n**为什么**:KMS 单次加密最多 4 KB 数据,大文件用 KMS API 加密会慢且贵。  \n**做法**:KMS 生成 Data Key → 用 Data Key 加密大数据 → 把 加密后的 Data Key 和密文一起存。  \n**SDK**:Encryption SDK / S3 Client 自动做这件事。\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"证明 AWS 拿不到我的密钥\" | **CloudHSM**(自带 HSM 硬件)或 **SSE-C** |\n| \"跨账号分享加密 snapshot / S3 对象\" | **Customer Managed Key** + key policy 给对方账号 |\n| \"key 每年自动旋转\" | CMK **Automatic Rotation**(默认 365 天) |\n| \"免费 KMS,只是加密\" | **AWS Managed Key**(免费查询) |\n| \"需要严格 FIPS 140-2 Level 3\" | **CloudHSM** |\n\n## 三、WAF / Shield — 边界防护\n\n### WAF(Web Application Firewall)\n\n- 部署在 **CloudFront / ALB / API Gateway / AppSync** 前\n- 规则:\n  - **Managed Rule Groups**(AWS / Marketplace 提供,OWASP Top 10、Bot Control)\n  - **Custom Rules**(自己写,基于 IP、URI、header、body、geo、rate-based)\n- **Rate-based Rule**:某 IP 5 分钟内 > N 请求 → 拦\n- 题目说 \"**SQL injection / XSS / OWASP** 防护\" → **WAF**\n- 题目说 \"**应用层 DDoS / API 暴刷**\" → **WAF rate-based** + Shield\n\n### Shield 三档\n\n| 档位 | 价格 | 防什么 |\n|------|------|--------|\n| **Shield Standard** | 免费 | L3/L4 自动防护(SYN flood、UDP reflection)|\n| **Shield Advanced** | $3000/月+ | + DDoS 响应团队、保险费用、L7 防护(配合 WAF)、多 Region 攻击聚合 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"应用层防 OWASP\" | **WAF** |\n| \"L3/L4 体积型 DDoS,默认就要的\" | **Shield Standard**(自动) |\n| \"高价值业务,需要 24h 响应、SLA 退款\" | **Shield Advanced** |\n\n## 四、Network Firewall\n\n- **VPC 级**深度包检测(SNI 检查、URL 过滤、IPS/IDS)\n- 用 Suricata 规则\n- 比 WAF 更底层(WAF 是 L7,Network FW 是 L3-L7)\n- 题目说 \"**egress filtering / 出向 URL 白名单**\" → **Network Firewall**\n\n## 五、AWS Firewall Manager\n\n- 在 **Organizations** 范围统一管理:\n  - WAF 规则\n  - Shield Advanced\n  - Network Firewall\n  - Security Group(发现公开 SG 等)\n- 适合多账号集中策略下发\n\n## 六、威胁检测三件套 — GuardDuty / Inspector / Macie\n\n### 一张对照表\n\n| 服务 | 关心什么 | 数据源 | 题目关键词 |\n|------|----------|--------|------------|\n| **GuardDuty** | **威胁检测**(异常 API、加密货币挖矿、被入侵主机)| CloudTrail、VPC Flow Logs、DNS、EKS 审计、Lambda、RDS | **malicious、threat、anomaly、compromised** |\n| **Inspector** | **漏洞扫描**(EC2 / 容器镜像 / Lambda 函数 CVE)| 自动扫,无需 agent(新版)| **vulnerability、CVE、patch** |\n| **Macie** | **PII / 敏感数据发现**(S3 中的信用卡、SSN、健康数据)| S3 对象 | **PII、HIPAA、sensitive data** |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"检测 EC2 是不是被入侵 / 挖矿\" | **GuardDuty** |\n| \"EC2 系统补丁缺失 / CVE 报告\" | **Inspector**(也可以 SSM Patch Manager) |\n| \"S3 里有没有信用卡号\" | **Macie** |\n| \"异常 API 行为(凌晨从陌生 IP 调) | **GuardDuty** |\n\n## 七、Secrets / Certs\n\n| 服务 | 一句话 |\n|------|--------|\n| **Secrets Manager** | 自动轮换的密钥 / DB 密码 |\n| **Parameter Store** | 配置 + 简单密钥(SecureString) |\n| **AWS Certificate Manager**(ACM) | **免费**公共证书 + 自动续期(只给 ALB / CloudFront / API GW / Elastic Beanstalk 等 AWS 服务用) |\n| **ACM Private CA** | 私有 CA,**收费** |\n\n**陷阱**:\n- ACM 证书**不能直接装到 EC2 应用**(只能给 AWS 服务)— 题目里\"EC2 上 nginx 用 SSL\"答案通常是把 nginx 卸载,改用 ALB + ACM。\n- 题目说 \"**RDS 密码每 N 天轮换**\" → **Secrets Manager**(不是 KMS / Parameter Store)。\n\n## 八、合规与审计\n\n| 服务 | 一句话 |\n|------|--------|\n| **Artifact** | 下载 AWS 合规报告(SOC、ISO、PCI DSS) |\n| **Audit Manager** | 持续审计证据收集,生成报告 |\n| **Detective** | GuardDuty 告警后**追根溯源**(关系图) |\n| **Security Hub** | **集中**所有安全告警(GuardDuty + Inspector + Macie + WAF + 等)+ 合规评分 |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"把 GuardDuty / Inspector / Macie 的告警都汇总\" | **Security Hub** |\n| \"GuardDuty 报警后调查根本原因\" | **Detective** |\n| \"合规报告(PCI DSS)\" | **Artifact** 下载 |\n| \"持续追踪合规证据\" | **Audit Manager** |\n\n## 九、跨账号 / 跨 Region 安全集中化\n\n```\n       Org Management Account\n              │\n   ┌──────────┼──────────────┐\n   ▼          ▼              ▼\nGuardDuty   Security      Config\nDelegated   Hub Delegated Aggregator\nAdmin       Admin         (Delegated)\n   │          │              │\n   └──────────┴──────────────┘\n              │\n        所有成员账号\n```\n\n- **Delegated Administrator** 是关键模式:Management Account 把审计 / 安全权交给某个\"安全账号\",成员账号自动汇总到该账号。\n\n## 十、自查清单\n\n- [ ] 我能说出 IAM Policy 评估的 5 个步骤\n- [ ] 我知道 SCP 不授权、只限制上限\n- [ ] 我能区分 GuardDuty / Inspector / Macie 何时用\n- [ ] 我知道 Shield Standard 免费,Advanced 用于高价值业务\n- [ ] 我能区分 ACM 证书的限制(不能给 EC2 上的 nginx)\n- [ ] 我知道 Security Hub 是集中汇总\n- [ ] 我能说出 Envelope Encryption 是怎么工作的\n\n下一章:[`09-迁移与混合云.md`](09-迁移与混合云.md)\n"}, {"id": "09-迁移与混合云", "title": "09 · 迁移与混合云", "filename": "09-迁移与混合云.md", "content": "# 09 · 迁移与混合云\n\n> 这章题量不多但**陷阱集中**。重点把\"什么场景用什么迁移服务\"对清楚。\n\n## 本章先懂这些词\n\n迁移题先判断两件事:迁的是什么,以及迁完后是否还要和本地持续互通。一次性搬数据和长期混合云,答案通常完全不同。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **On-premises** | 本地机房/自有数据中心 | 和 AWS 互联、迁移上云 |\n| **Hybrid cloud** | 本地和云同时使用 | Storage Gateway、VPN、DX、Outposts |\n| **Lift-and-shift / Rehost** | 基本不改应用,整机搬到云上 | MGN |\n| **Sync** | 持续或定时同步文件 | DataSync |\n| **Offline transfer** | 用物理设备搬数据 | Snowball |\n| **NFS / SMB** | 文件共享协议 | Linux 常 NFS,Windows 常 SMB |\n| **SFTP / FTPS / FTP** | 文件传输协议 | Transfer Family |\n| **iSCSI** | 把远端存储当块设备用 | Volume Gateway |\n\n## 一、上云迁移服务矩阵\n\n```\n要迁什么?\n   │\n   ├─ 整台服务器(VM) ─→ AWS Application Migration Service (MGN)\n   ├─ 数据库 ──────────→ DMS(+ SCT 异构 schema)\n   ├─ 文件 ─ NFS/SMB ──→ DataSync\n   ├─ 大块数据(PB)──→ Snowball / Snowmobile\n   ├─ 流式 SFTP/FTPS ──→ Transfer Family\n   ├─ 整个应用栈发现 ──→ Application Discovery Service\n   └─ 多账号迁移管理 ──→ Migration Hub(顶层 dashboard)\n```\n\n## 二、Snow 家族 — 一句话区分\n\n| 设备 | 容量 | 计算? | 何时用 |\n|------|------|-------|--------|\n| **Snowcone** | **8 TB** HDD / 14 TB SSD | 边缘小计算 | IoT 边缘、单兵带走、小数据 |\n| **Snowball Edge Storage Optimized** | **80 TB** | 限定 | 离线传输大量数据 |\n| **Snowball Edge Compute Optimized** | 42 TB | EC2 + GPU | 边缘 ML、视频处理 |\n| **Snowmobile**(已退役)| 100 PB | — | 数据中心整体搬迁 |\n\n### Snow 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"100 TB 数据 + 网络很慢\" | **Snowball Edge** |\n| \"小型 IoT 边缘,断网采集\" | **Snowcone** |\n| \"**几个 GB / TB** 数据,网络好\" | **不要选 Snow,选 S3 + DataSync / Transfer Acceleration**(Snow 是杀鸡用牛刀) |\n\n## 三、AWS DataSync vs Storage Gateway — 必须分清\n\n| 维度 | DataSync | Storage Gateway |\n|------|----------|-----------------|\n| 模式 | **一次性 / 调度同步** | **持续混合存储** |\n| 协议 | NFS / SMB / HDFS / S3 / EFS / FSx | NFS / SMB / iSCSI / Tape |\n| 用途 | 把本地文件**迁到 AWS** | 让本地应用**像本地一样**访问云存储 |\n| 关键词 | migrate、sync、transfer | **hybrid、on-premises 持续访问** |\n\n### Storage Gateway 三种类型\n\n| 类型 | 行为 |\n|------|------|\n| **File Gateway** | 本地通过 NFS/SMB 访问,**后端是 S3** |\n| **Volume Gateway**(Cached / Stored) | iSCSI 块设备 — Cached:热数据本地,冷数据在 S3;Stored:全部本地 + Snapshot 到 S3 |\n| **Tape Gateway** | 把本地磁带备份程序 **替换为云** → S3 + Glacier |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"本地 NFS 文件**一次性**迁到 S3\" | **DataSync** |\n| \"本地应用继续用 NFS,数据其实在 S3\" | **File Gateway** |\n| \"本地有备份软件用磁带,想换 cloud\" | **Tape Gateway** |\n| \"VMware 上的服务器迁过来\" | **AWS Application Migration Service (MGN)** |\n| \"数据库 Oracle → Aurora 异构迁移\" | **SCT + DMS** |\n| \"Oracle → Oracle 同构迁移\" | **DMS** 直接 |\n\n## 四、AWS Transfer Family\n\n- **SFTP / FTPS / FTP / AS2** 端点,后端 S3 或 EFS\n- 用 IAM / AD / 自定义身份验证\n- 题目说\"客户用 SFTP 上传文件到我们 S3\" → **Transfer Family**(不是 DataSync)\n\n## 五、混合云 — 计算与运营\n\n| 服务 | 一句话 |\n|------|--------|\n| **AWS Outposts** | **AWS 硬件搬到你机房**,跑 EC2/S3/RDS/EKS,**API 一致** |\n| **AWS Local Zones** | AWS 在大城市的\"小 Region\"扩展,低延迟到本地 |\n| **AWS Wavelength** | 5G 运营商基站内的 AWS 计算,**极低移动延迟** |\n| **VMware Cloud on AWS** | 在 AWS 跑 VMware 集群 |\n| **EKS Anywhere / ECS Anywhere** | 在本地 / 多云跑 EKS/ECS 控制 |\n| **AWS App Mesh** | Service mesh,跨 EC2/ECS/EKS |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"受数据驻留法规约束,数据必须留在本地,但还想用 AWS API\" | **Outposts** |\n| \"应用对延迟极敏感(< 10ms),本地城市无 Region\" | **Local Zones** |\n| \"5G 移动游戏 / AR 极低延迟\" | **Wavelength** |\n| \"已有 VMware 投资,想保留 + 上云\" | **VMware Cloud on AWS** |\n\n## 六、Application Migration Service (MGN) vs Server Migration Service (SMS)\n\n- **MGN**(新)— 推荐,**lift-and-shift** 服务器(物理 / 虚拟 / VMware / Hyper-V / 云上)整机搬迁\n- **SMS** — 旧的,已被 MGN 取代\n- 题目说\"**lift-and-shift / rehost**\" → **MGN**\n\n### 6 R 迁移策略(常考概念)\n\n| 策略 | 一句话 | 工具 |\n|------|--------|------|\n| **Rehost**(lift-and-shift) | 不改代码搬过来 | **MGN** |\n| **Replatform**(lift-tinker-shift) | 小调整(如换 RDS) | **DMS** |\n| **Repurchase**(drop and shop) | 换 SaaS | — |\n| **Refactor / Re-architect** | 重写为云原生 | CDK / Lambda |\n| **Retire** | 退役 | — |\n| **Retain** | 暂留本地 | — |\n\n## 七、Application Discovery Service\n\n- 在本地装 agent 或 agentless,**发现服务器、依赖、网络流量**\n- 输出给 **Migration Hub** 做计划\n- 题目说\"我也不知道哪些服务器要迁,先扫一遍\" → **Application Discovery Service**\n\n## 八、自查清单\n\n- [ ] 我能 1 秒分清 DataSync 和 Storage Gateway\n- [ ] 我知道 Storage Gateway 三种类型的协议(NFS/SMB,iSCSI,iSCSI VTL)\n- [ ] 我知道 Snowball 不适合 GB-TB 级别的快网络场景\n- [ ] 我能区分 Outposts / Local Zones / Wavelength\n- [ ] 我知道 Oracle → Aurora 要 SCT + DMS\n\n下一章:[`10-成本优化.md`](10-成本优化.md)\n"}, {"id": "10-成本优化", "title": "10 · 成本优化", "filename": "10-成本优化.md", "content": "# 10 · 成本优化 — 把每一分钱花在刀刃上\n\n> Domain 4 占 20%。**几乎每道题都隐含\"最便宜\"的修饰词**,这章把所有省钱杠杆梳理一遍。\n\n## 本章先懂这些词\n\n成本优化不是无脑选最便宜,而是在满足题目硬要求后减少浪费。SAA 的成本题常把\"便宜\"和\"高可用/高性能/低运维\"一起问,所以先满足硬约束,再省钱。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **Right-sizing** | 把资源规格调到刚好够用 | Compute Optimizer |\n| **Idle resource** | 闲置但仍收费的资源 | 未挂载 EBS、未用 EIP、空跑 EC2 |\n| **Commitment** | 承诺用 1/3 年换折扣 | Savings Plans / Reserved |\n| **Spot** | 用 AWS 空闲容量,便宜但可中断 | 批处理、可重试任务 |\n| **Data transfer** | 数据传输费 | 跨 AZ、跨 Region、出公网常是陷阱 |\n| **Lifecycle** | 数据按时间自动降冷或删除 | S3、日志、备份省钱 |\n| **Cost allocation tag** | 成本分摊标签 | 按部门/项目看账单 |\n| **CUR** | Cost and Usage Report,最细账单 | Athena 分析成本 |\n\n## 一、计算成本 — 关键杠杆\n\n(详见 [`05-计算服务选型.md`](05-计算服务选型.md))\n\n| 杠杆 | 最大节省 | 何时用 |\n|------|---------|--------|\n| **Spot Instances** | **90%** | 容错任务、Worker、CI |\n| **Savings Plans** | 72% | 稳定的长期负载 |\n| **Reserved Instances** | 72% | 同上,但绑死实例族 |\n| **Graviton(ARM)** | 20-40% | 兼容 Linux 应用,**几乎免费的午餐** |\n| **Right-sizing** | 看情况 | Compute Optimizer 推荐 |\n| **Auto Scaling 缩容** | 看情况 | 夜间 / 非高峰自动减实例 |\n| **Stop 非生产环境** | 全部 | Lambda 调度自动 stop/start |\n\n### Spot 高级用法\n\n| 方法 | 说明 |\n|------|------|\n| **Spot Fleet** | 多实例族 / 多 AZ 混搭,提高可用性 |\n| **Mixed Instance Policy(ASG)** | ASG 内混 On-Demand + Spot,设比例 |\n| **Spot Instance Advisor** | 看哪些实例族中断率低 |\n\n## 二、存储成本 — 几个关键决策\n\n### S3 优化\n\n| 杠杆 | 一句话 |\n|------|--------|\n| **Intelligent-Tiering** | 不知道访问模式时**首选** |\n| **Lifecycle Policy** | N 天后转 IA,M 天后转 Glacier,K 天后删 |\n| **Storage Lens** | 跨账号 / 跨桶**用量与节省建议** |\n| **S3 Analytics** | 看每个桶访问模式,推荐转 IA |\n| **Multi-part upload incomplete cleanup** | 设 lifecycle 删除未完成的分段上传(常见隐形成本) |\n| **Glacier vs Deep Archive** | 一年内可能要回来 → Glacier;**几乎不回** → Deep Archive |\n\n### EBS 优化\n\n- **gp2 → gp3** 升级(20% 便宜,且 IOPS 独立买)\n- 未挂载的 EBS 卷 / 未关联的 EIP **仍然收费** — **Trusted Advisor / Cost Explorer Recommendations** 帮你找\n- EBS Snapshot 也按 GB 收(增量,但还是钱)\n\n### 数据传输\n\n| 场景 | 价格 |\n|------|------|\n| **进入 AWS**(internet → EC2/S3) | **免费** |\n| **AZ 之间**(VPC 内同 Region) | $0.01/GB(各方向) |\n| **Region 之间** | $0.02/GB+ |\n| **AWS 出公网**(EC2 → internet) | $0.09/GB+(头 10 TB) |\n| **同 Region 同 AZ**(EC2 ↔ EC2 私有 IP) | 免费 |\n| **CloudFront 出公网** | 比 EC2 出公网便宜很多 |\n\n**陷阱**:\n- 题目说 \"**减少跨 AZ 流量**\" → 让应用在**同 AZ 内调用**(用 ALB + zonal target group / Aurora Read Replica 同 AZ)\n- 题目说 \"**用 CloudFront 省钱**\" → 出公网走 CloudFront 比直接 EC2 出便宜\n- 题目说 \"**S3 Gateway Endpoint**\" → 私有访问 S3 **免数据费**(对 NAT 来说能省一大笔)\n\n## 三、Cost 管理工具\n\n| 工具 | 一句话 |\n|------|--------|\n| **AWS Cost Explorer** | 历史 + 预测 + 推荐 |\n| **AWS Budgets** | 设预算,超阈值告警 |\n| **AWS Cost Anomaly Detection** | ML 检测异常花费 |\n| **Cost & Usage Report (CUR)** | 最细粒度账单 → S3 → Athena 分析 |\n| **Trusted Advisor**(成本部分)| 闲置资源、低利用率 |\n| **Compute Optimizer** | EC2 / EBS / Lambda / ASG 大小建议 |\n| **Savings Plans Recommendations** | Cost Explorer 推荐买哪个 SP |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"**月底前**收到花费告警\" | **AWS Budgets**(可绑 SNS) |\n| \"意外的费用尖峰自动检测\" | **Cost Anomaly Detection** |\n| \"细到每个标签的成本分析\" | **Cost Allocation Tags** + Cost Explorer |\n| \"EC2 right-size 建议\" | **Compute Optimizer** |\n| \"公司总账单分摊到各部门\" | **Organizations + Cost Allocation Tags + CUR** |\n\n## 四、数据库 / 缓存 成本\n\n| 杠杆 | 一句话 |\n|------|--------|\n| **Aurora Serverless v2** | 间歇负载省成本(秒级缩到 0.5 ACU) |\n| **Aurora I/O-Optimized** | 高 I/O 量时比标准便宜(无 I/O 费用) |\n| **DynamoDB On-Demand vs Provisioned** | 稳定 → Provisioned + Reserved Capacity 省 60% |\n| **RDS Reserved** | 1/3 年承诺 |\n| **DynamoDB Global Tables** | 跨 Region 写入,**注意请求加倍计费** |\n| **ElastiCache Reserved** | 长期缓存 |\n\n## 五、监控 / 日志成本\n\n- **CloudWatch Logs** 按摄入量收费,**长期保留转 S3** + Lifecycle 转 Glacier\n- **VPC Flow Logs** 同上,巨量,选择性开启\n- **X-Ray** 按 trace 收费,**采样率**可调\n- **CloudTrail Data Events** 不是默认开启,小心额外计费\n\n## 六、设计原则:从一开始就考虑成本\n\n### \"最便宜\" vs \"最高性能\" 的平衡\n\n很多 SAA 题目同时要求\"成本最低\"和\"高性能\"。**通常答案是**:\n- 计算 → **Lambda / Fargate**(按用量)\n- 存储 → **S3 + 合适存储类**\n- 数据库 → **Aurora Serverless** 或 **DynamoDB On-Demand**\n- 流量 → **CloudFront / Gateway Endpoint**\n\n### \"成本 + 弹性\"\n\n题目说 \"**应对突发流量但平时空闲**\" → Serverless 三件套(Lambda + DynamoDB + API GW)+ CloudFront\n\n### \"成本 + 容错\"\n\n题目说 \"**批处理任务,容忍中断,最便宜**\" → **Spot + Batch / Fargate Spot**\n\n## 七、Free Tier 高频考点\n\n- EC2 t2.micro / t3.micro **750 小时 / 月,12 个月**\n- S3 5GB / 20K GET / 2K PUT,12 个月\n- Lambda **永久免费 1M 调用 / 400K GB-秒 / 月**\n- DynamoDB **永久免费 25 GB / 200M 请求**\n- CloudFront 1 TB / 月,12 个月\n\n(SAA 较少考 Free Tier,但偶尔会出现)\n\n## 八、自查清单\n\n- [ ] 我知道每种省钱杠杆的最大节省比例\n- [ ] 我能识别题目里的\"跨 AZ\"流量陷阱\n- [ ] 我知道 S3 Gateway Endpoint 是免费的且能省 NAT 钱\n- [ ] 我能区分 Cost Explorer / Budgets / Cost Anomaly / CUR\n- [ ] 我知道 Graviton 是几乎免费的午餐\n- [ ] 我知道 Spot + Batch 是经典批处理省钱组合\n\n下一章:[`11-Well-Architected五大支柱.md`](11-Well-Architected五大支柱.md)\n"}, {"id": "11-Well-Architected五大支柱", "title": "11 · Well-Architected五大支柱", "filename": "11-Well-Architected五大支柱.md", "content": "# 11 · Well-Architected 五大支柱 — SAA 的\"答题宪法\"\n\n> 这五个支柱不是抽象口号,它是 AWS 用来\"打分\"你架构方案的尺。**每道 SAA 题背后都是其中一个或多个支柱在被问。**\n\n## 本章先懂这些词\n\nWell-Architected 可以理解成 AWS 的架构评分表。初学时不用背官方长文,先记住:安全、可靠、性能、成本、运维这五个方向会同时拉扯,考题就是让你在拉扯中选最平衡的方案。\n\n| 术语 | 白话解释 | 常见考法 |\n|------|----------|----------|\n| **Pillar** | 支柱,评估架构的一个维度 | 安全/可靠/性能/成本/运维 |\n| **Workload** | 一套业务系统或应用 | 被评估和优化的对象 |\n| **Best practice** | AWS 推荐做法 | 托管、多 AZ、最小权限、自动化 |\n| **Trade-off** | 取舍 | 便宜 vs 快恢复,低运维 vs 灵活控制 |\n| **RTO** | 最多能停多久 | 恢复时间目标 |\n| **RPO** | 最多能丢多久数据 | 恢复点目标 |\n| **DR** | Disaster Recovery,灾难恢复 | 跨 Region 备份/主备/双活 |\n| **Observability** | 可观测性 | 通过指标、日志、追踪定位问题 |\n\n## 一、五大支柱总览\n\n| 支柱 | 关键词 | 工具集 |\n|------|--------|--------|\n| 1️⃣ **Operational Excellence**(运维卓越) | 自动化、IaC、可观测、可演进 | CloudWatch、CloudTrail、CloudFormation、SSM |\n| 2️⃣ **Security**(安全) | 身份、加密、审计、深度防御 | IAM、KMS、GuardDuty、Shield、WAF |\n| 3️⃣ **Reliability**(可靠性) | 多 AZ、自动恢复、限流降级 | ASG、Multi-AZ、Route 53、SQS |\n| 4️⃣ **Performance Efficiency**(性能效率) | 选对服务、用对实例族、缓存 | ElastiCache、CloudFront、Right-sizing |\n| 5️⃣ **Cost Optimization**(成本优化) | 按需付费、关停闲置、采购优化 | Spot、Savings Plans、Lifecycle |\n\n(2021 年后加了第 6 个:**Sustainability** — 可持续性,SAA 偶有涉及)\n\n## 二、识别题目背后的支柱(超级实用)\n\n| 题目关键词 | 主要支柱 |\n|------------|---------|\n| \"高可用 / failover / RTO RPO / 多 AZ\" | **Reliability** |\n| \"防护 / 加密 / 合规 / 审计 / 身份\" | **Security** |\n| \"性能 / 延迟 / 吞吐 / 缓存 / scale\" | **Performance Efficiency** |\n| \"便宜 / 优化成本 / 闲置 / right-size\" | **Cost Optimization** |\n| \"运维负担 / fully managed / automation\" | **Operational Excellence** |\n\n⚠️ **大多数 SAA 题同时涉及 2-3 个支柱**,识别**主导支柱**就能锁定方向。\n\n## 三、Reliability(可靠性)— 设计韧性\n\n### 三层韧性原则\n\n```\n1. Foundations       Service Quotas、网络容量\n        ↓\n2. Workload Architecture   多 AZ、解耦、限流、bulkhead\n        ↓\n3. Change Management   滚动部署、IaC、自动恢复\n```\n\n### 高频考点\n\n| 概念 | 一句话 |\n|------|--------|\n| **RPO**(Recovery Point Objective)| 能丢多久数据 |\n| **RTO**(Recovery Time Objective)| 能停多久服务 |\n| **Backup & Restore** | 最便宜,RTO 几小时,RPO 取决备份频率 |\n| **Pilot Light** | DR Region 跑核心(DB)但不跑应用,RTO 10 分钟 |\n| **Warm Standby** | DR Region 跑缩容版本,RTO 几分钟 |\n| **Multi-Site Active-Active** | 两个 Region 都跑,RTO ~ 秒 |\n\n### 四种 DR 策略 — 决策树\n\n```\n最便宜 ──────────────────────────── 最快恢复\nBackup & Restore → Pilot Light → Warm Standby → Active-Active\n```\n\n| 题目说 | 答案 |\n|--------|------|\n| \"最便宜的 DR,可接受小时级恢复\" | **Backup & Restore** |\n| \"DB 跨 Region 复制,应用按需启动\" | **Pilot Light** |\n| \"DR Region 平时跑小规模\" | **Warm Standby** |\n| \"RTO < 1 分钟、RPO < 1 秒\" | **Active-Active** + Aurora Global DB / DynamoDB Global Tables |\n\n### 自动恢复模式\n\n- **ASG + Multi-AZ ELB**:实例挂了自动起新的\n- **EC2 Auto Recovery**(基于 CloudWatch):硬件故障自动迁\n- **RDS Multi-AZ**:主挂了自动切到备\n- **Route 53 Failover**:Region 级别切换\n\n## 四、Security(安全)— 深度防御 5 层\n\n(详见 [`08-安全与合规.md`](08-安全与合规.md))\n\n```\n            Identity → IAM, SSO, MFA, federation\n                ↓\n            Network → VPC, SG, NACL, WAF, Shield\n                ↓\n            Data    → KMS, S3 encryption, TLS, Macie\n                ↓\n            Detection → GuardDuty, Config, CloudTrail\n                ↓\n            Response → SNS, Lambda, Step Functions, IR\n```\n\n### 设计原则\n\n- **最小权限**:能用 Role 就别用 User;能给具体 action 就别 `*`\n- **静态加密 + 传输加密**(at rest + in transit)— **几乎每道安全题的答案都包含这两个**\n- **不放凭证在代码里**:Secrets Manager / Parameter Store + IAM Role\n- **分账户隔离环境**:Prod / Dev / Sandbox 独立账号\n\n## 五、Performance Efficiency(性能效率)\n\n### 四个维度的选择\n\n| 维度 | 选项 |\n|------|------|\n| **计算** | EC2 / Lambda / ECS / Fargate / 实例族选择 |\n| **存储** | 块 / 文件 / 对象,IOPS vs 吞吐 |\n| **数据库** | SQL vs NoSQL vs 时序 vs 图 |\n| **网络** | CloudFront / Global Accelerator / VPC Endpoints |\n\n### 性能题的固定套路\n\n```\n1. 找瓶颈在哪一层?\n2. 这一层有没有 AWS managed 服务可换?\n3. 能不能加缓存 / CDN?\n4. 能不能用更专用的服务(图、时序、流式)?\n```\n\n## 六、Cost Optimization(成本优化)\n\n(详见 [`10-成本优化.md`](10-成本优化.md))\n\n### 五大杠杆\n\n1. **关停 / 缩容** — Auto Scaling、夜间停 EC2\n2. **采购** — Savings Plans / Reserved / Spot\n3. **架构** — Serverless、Right-sizing、Graviton\n4. **数据生命周期** — S3 lifecycle、log retention\n5. **流量** — CloudFront、Endpoint、同 AZ 调用\n\n## 七、Operational Excellence(运维卓越)\n\n| 概念 | 关键工具 |\n|------|---------|\n| **IaC**(代码即基础设施) | CloudFormation / CDK / Terraform |\n| **可观测**(Observability) | CloudWatch / X-Ray / OpenSearch |\n| **自动化运维** | SSM Automation / EventBridge + Lambda |\n| **CI/CD** | CodePipeline / CodeBuild / CodeDeploy |\n| **变更管理** | Change sets、deployment groups、Blue/Green |\n\n### 题目套路\n\n| 题目说 | 答案 |\n|--------|------|\n| \"**多环境一致部署**\" | **CloudFormation StackSets** |\n| \"**蓝绿部署 / canary**\" | **CodeDeploy** + **Lambda alias** / ECS / Elastic Beanstalk |\n| \"运维人员故障定位慢\" | **X-Ray + CloudWatch Logs Insights** |\n| \"**减少运维负担**\" → 答案里**几乎一定**包含 | \"**Serverless**\" / \"**managed service**\" |\n\n## 八、AWS Well-Architected Tool\n\n- 控制台里给你一份\"自测问卷\",按 6 个支柱打分\n- 输出\"高风险问题\"(HRI)\n- 题目说\"评估架构是否符合 best practice\" → **Well-Architected Tool**\n\n## 九、答题宪法 — 一句话送你\n\n> **当你不确定时,挑那个\"运维最少、最 managed、最 serverless、最便宜、最弹性\"的选项。**\n\n这一句话能帮你正确处理至少 30% 的题。\n\n## 十、自查清单\n\n- [ ] 我能在 5 秒内说出 5 大支柱\n- [ ] 我能从题目关键词识别出主导支柱\n- [ ] 我能区分 4 种 DR 策略的 RTO/RPO 排序\n- [ ] 我知道 \"深度防御 5 层\" 的位置\n- [ ] 我能背出 \"运维卓越 = IaC + 可观测 + 自动化\"\n\n下一章:[`12-考前冲刺与答题套路.md`](12-考前冲刺与答题套路.md)\n"}, {"id": "12-考前冲刺与答题套路", "title": "12 · 考前冲刺与答题套路", "filename": "12-考前冲刺与答题套路.md", "content": "# 12 · 考前冲刺与答题套路\n\n> 最后 1 周的\"心法 + 套路\"集合,把考场上的速度提一倍。\n\n## 初学者怎么用本章\n\n本章不是让你在最后一周硬背所有服务,而是把前面学过的知识压缩成\"看到关键词就能选方向\"。如果某个速记词看不懂,先回对应章节补概念,不要只背表格。\n\n| 你卡住的地方 | 回去看哪章 | 目标 |\n|--------------|------------|------|\n| 不知道题目问的是安全还是成本 | `00`, `11` | 先识别主导支柱 |\n| 服务名字都认识,但不知道选哪个 | `02`-`06` | 看选型决策树 |\n| 缩写太多看晕 | `13` 术语速查表 | 先把词义补齐 |\n| 错题反复错 | 对应主题章节 + 本章第六节 | 建立易混点对照 |\n\n## 一、考前 1 周的复习节奏\n\n### Day -7 ~ -5:错题二刷\n- 用本仓库 quiz-app 的\"错题\"过滤器\n- **不**做新题,**只过**之前错过的\n- 目标:错题正确率 > 90%\n\n### Day -4 ~ -2:模考 × 3 套\n- 用 quiz-app 的\"模拟考试\"功能(65 题 / 130 分钟)\n- 每套之间隔 1 天\n- 错题立刻归因到学习框架某一章\n\n### Day -1:**完全不学习**\n- 复习一份**易混点速查表**(本章第六节)\n- 准备好身份证 / 设备 / 网络\n\n### 考试当天\n- 提前 30 分钟到达 / 联网\n- **不要**早交卷,有时间一定**回头检查**\n\n## 二、考场答题节奏\n\n```\n130 分钟 / 65 题 ≈ 每题 2 分钟\n```\n\n### 三遍法\n\n1. **第一遍**(80 分钟):快速过完所有题,**会的当场做,不会的 mark 一下跳过**\n2. **第二遍**(35 分钟):专攻 marked 题,**仔细读、消除明显错误项**\n3. **第三遍**(15 分钟):剩下还纠结的题,**用排除法蒙最有信心的那个**\n\n⚠️ **重要**:**不要**在第一遍就死磕一题超过 3 分钟,你的时间预算就崩了。\n\n## 三、答题套路五步法\n\n```\n1. 找\"最 / 最少 / 唯一\"等修饰词    ← 决定主导支柱\n2. 扫一眼选项,看有无明显错误项     ← 排除掉\n3. 找题目里的硬约束(性能 / 成本 / 时间) ← 缩小范围\n4. 在剩下选项里找\"运维最少 / 最 managed\" ← 通常是答案\n5. 实在不会,选你\"听起来最像 AWS 推荐\"的那个\n```\n\n## 四、典型陷阱关键词重读\n\n(详见 [`00-从CLF到SAA的心智转换.md`](00-从CLF到SAA的心智转换.md))\n\n| 陷阱关键词 | 通常排除 |\n|------------|----------|\n| **manual / 自己写脚本 / cron** | 运维高 |\n| **EC2 自己装 X**(代替 RDS / EFS) | 运维高 |\n| **NAT instance**(不是 NAT Gateway) | 单点 / 老旧 |\n| **重写应用 / 大改架构** | 工作量大 |\n| **Snowball** 用于小数据 | 大材小用 |\n| **跨 Region 双向同步** | 复杂 |\n| **EBS Snapshot 跨 AZ 然后恢复** 当主存储 | 中间步骤多 |\n\n## 五、AWS 服务速记 — 1 句话记忆表\n\n### 计算\n\n| 服务 | 一句话 |\n|------|--------|\n| EC2 | 虚拟机,什么都能跑 |\n| Lambda | 函数,15 分钟以内事件触发 |\n| Fargate | 无服务器容器 |\n| ECS | AWS 原生容器编排 |\n| EKS | 托管 Kubernetes |\n| Batch | 容器化批任务调度 |\n| Beanstalk | 一键 web 应用部署 |\n| App Runner | 最简单的容器 → URL |\n| Outposts | 你机房的 AWS 硬件 |\n\n### 存储\n\n| 服务 | 一句话 |\n|------|--------|\n| S3 | 对象存储,互联网级 |\n| EBS | EC2 的硬盘,单 AZ |\n| EFS | NFS,多 AZ 共享 |\n| FSx for Windows | SMB / AD |\n| FSx for Lustre | HPC + S3 |\n| FSx for ONTAP | NetApp 兼容 |\n| Storage Gateway | 本地访问 S3 / 备份 |\n| DataSync | 文件迁移 |\n| Snowball | 离线大批量传输 |\n\n### 数据库\n\n| 服务 | 一句话 |\n|------|--------|\n| RDS | 托管关系数据库 |\n| Aurora | 云原生关系数据库,RDS 升级版 |\n| DynamoDB | 海量 KV NoSQL,毫秒 |\n| ElastiCache | Redis / Memcached 缓存 |\n| DocumentDB | MongoDB 兼容 |\n| Neptune | 图数据库 |\n| Timestream | 时序数据库 |\n| QLDB | 不可篡改账本 |\n| Keyspaces | Cassandra 兼容 |\n| MemoryDB | 持久化 Redis |\n| Redshift | 数据仓库 |\n| Athena | 直接查 S3 |\n| Glue | Serverless ETL |\n| EMR | 自管 Spark / Hadoop |\n| OpenSearch | 全文搜索 / 日志 |\n| QuickSight | BI 报表 |\n\n### 网络\n\n| 服务 | 一句话 |\n|------|--------|\n| VPC | 虚拟数据中心 |\n| ALB | L7 负载均衡 + 路径路由 |\n| NLB | L4 高吞吐 + 静态 IP |\n| GWLB | 第三方安全设备穿透 |\n| Route 53 | DNS + 7 种路由 + 健康检查 |\n| CloudFront | CDN |\n| Global Accelerator | 动态加速 + 静态 IP |\n| PrivateLink | 跨账号私有服务暴露 |\n| Transit Gateway | 中心辐射多 VPC 互联 |\n| Direct Connect | 物理专线 |\n| Site-to-Site VPN | IPsec 加密 |\n\n### 集成与消息\n\n| 服务 | 一句话 |\n|------|--------|\n| SQS | 队列,点对点 |\n| SNS | Pub/Sub 扇出 |\n| EventBridge | 事件总线 + 规则 |\n| Kinesis Data Streams | 实时流 + 重放 |\n| Kinesis Firehose | 流 → S3/Redshift |\n| MSK | 托管 Kafka |\n| Step Functions | 工作流编排 |\n| API Gateway | REST/WebSocket/HTTP API 网关 |\n| AppSync | GraphQL 托管 |\n\n### 安全\n\n| 服务 | 一句话 |\n|------|--------|\n| IAM | 身份与策略 |\n| Identity Center | 多账号 SSO |\n| Cognito | 用户池 + 联邦 |\n| KMS | 密钥管理 |\n| CloudHSM | 专属 HSM |\n| Secrets Manager | 密钥 + 轮换 |\n| Parameter Store | 配置 + 简单密钥 |\n| ACM | 免费公共证书 |\n| WAF | L7 防护 |\n| Shield | DDoS 防护 |\n| Network Firewall | VPC L3-L7 防火墙 |\n| Firewall Manager | 跨账号防火墙策略 |\n| GuardDuty | 威胁检测 |\n| Inspector | 漏洞扫描 |\n| Macie | S3 PII 发现 |\n| Detective | 告警根因分析 |\n| Security Hub | 安全集中告警 |\n| Artifact | 合规报告下载 |\n| Audit Manager | 持续合规审计 |\n\n### 运维与监控\n\n| 服务 | 一句话 |\n|------|--------|\n| CloudWatch | 监控 + 日志 + 告警 |\n| CloudTrail | API 审计 |\n| Config | 配置合规 |\n| Systems Manager | 运维瑞士军刀 |\n| Session Manager | 私有 EC2 登录 |\n| Patch Manager | 自动打补丁 |\n| Trusted Advisor | 自动巡检 |\n| Health Dashboard | AWS 服务状态 |\n\n### 成本\n\n| 服务 | 一句话 |\n|------|--------|\n| Cost Explorer | 历史 + 预测 |\n| Budgets | 预算 + 告警 |\n| Cost Anomaly Detection | ML 异常检测 |\n| CUR | 最细粒度账单 |\n| Compute Optimizer | Right-sizing 建议 |\n\n### 迁移\n\n| 服务 | 一句话 |\n|------|--------|\n| MGN | 服务器整机迁移 |\n| DMS | 数据库迁移 |\n| SCT | Schema 异构转换 |\n| Transfer Family | SFTP/FTPS → S3 |\n| Application Discovery Service | 资产盘点 |\n| Migration Hub | 迁移总览 |\n\n## 六、易混点速查表(考前 1 天看这个)\n\n| 选项 A | 选项 B | 如何选? |\n|--------|--------|---------|\n| **SQS** | **Kinesis** | 队列消费完就删 / 流式有重放需求 |\n| **SNS** | **EventBridge** | 简单广播 / 复杂事件规则 + SaaS |\n| **ALB** | **NLB** | L7 路径 / L4 静态 IP UDP |\n| **CloudFront** | **Global Accelerator** | 缓存静态 + HTTPS / 动态 + TCP UDP + 静态 IP |\n| **Multi-AZ** | **Read Replica** | 可用性 / 读性能 |\n| **EFS** | **EBS** | 多 AZ NFS / 单 AZ 块 |\n| **DataSync** | **Storage Gateway** | 一次迁移 / 持续访问 |\n| **DMS** | **DataSync** | 数据库 / 文件 |\n| **Secrets Manager** | **Parameter Store** | 自动轮换 / 简单配置 |\n| **Inspector** | **GuardDuty** | 漏洞 CVE / 威胁行为 |\n| **CloudTrail** | **Config** | 谁做了什么 / 状态是否合规 |\n| **WAF** | **Network Firewall** | L7 OWASP / L3-L7 通用 |\n| **VPC Peering** | **Transit Gateway** | 点对点不传递 / 中心辐射 |\n| **NAT Gateway** | **NAT Instance** | 99% 都选 Gateway |\n| **Gateway Endpoint** | **Interface Endpoint** | S3/DynamoDB 免费 / 其他付费 |\n| **Step Functions Standard** | **Express** | 1 年 / 5 分钟 + 高 QPS |\n| **Aurora Global DB** | **Cross-Region Replica** | RPO ~1 秒 / RPO 分钟级 |\n| **Spot** | **Savings Plans** | 容错任务 / 稳定承诺 |\n| **Athena** | **Redshift** | 查 S3 / 数据仓库 |\n| **Snowball** | **DataSync** | TB+ 离线 / TB- 网络好 |\n| **CloudFormation** | **OpsWorks**(冷门) | 描述式 IaC / Chef/Puppet |\n| **QLDB** | **DynamoDB** | 不可篡改账本 / 通用 NoSQL |\n\n## 七、最后一句话\n\n> SAA-C03 不是一门\"知识考试\",是一门\"**判断力**考试\"。  \n> 它问的不是\"AWS 提供什么\",而是\"你**会不会**选 AWS 提供的东西\"。  \n> 把每道错题都当作一次\"判断力训练\"。**坚持下去,你会在某一天突然发现 — 题目还没看完,答案就已经浮现了。**\n\n考试加油!💪\n\n附录:[`13-专有词速查表.md`](13-专有词速查表.md)\n"}, {"id": "13-专有词速查表", "title": "13 · 专有词速查表", "filename": "13-专有词速查表.md", "content": "# 13 · 专有词速查表 — 初学者友好版\n\n> 这不是完整 AWS 百科,而是 SAA 题目里最常见的词义对照。遇到缩写先来这里找\"白话意思\",再回对应章节看选型。\n\n## 一、考试问法常见词\n\n| 术语 | 白话解释 | 看到它时先想 |\n|------|----------|--------------|\n| **MOST / LEAST** | 最符合 / 最少 | 题目在比较优先级,不是问能不能做 |\n| **minimal operational overhead** | 运维负担最少 | 托管服务、serverless、自动化 |\n| **cost-effective** | 满足需求下性价比最高 | 先满足硬要求,再省钱 |\n| **highly available** | 高可用 | 多 AZ、自动故障转移 |\n| **fault tolerant** | 能容忍部分组件失败 | 冗余、解耦、重试 |\n| **resilient** | 有韧性,故障后能恢复 | 多 AZ、备份、DR、自动恢复 |\n| **scalable** | 能随流量扩展 | Auto Scaling、serverless、托管服务 |\n| **durable** | 数据不容易丢 | S3、备份、复制 |\n| **compliant** | 满足法规/公司规定 | 加密、审计、不可篡改、报告 |\n| **least privilege** | 最小权限 | IAM policy 只给必要动作 |\n\n## 二、基础设施词\n\n| 术语 | 白话解释 | 典型服务 |\n|------|----------|----------|\n| **Region** | AWS 地理区域 | Tokyo、Virginia、Singapore |\n| **AZ** | Region 内独立机房组 | 多 AZ 部署 |\n| **VPC** | 私有云网络 | 子网、路由、安全组 |\n| **Subnet** | VPC 内的一段网段 | Public / Private subnet |\n| **ENI** | 网卡 | EC2、Lambda in VPC |\n| **Security Group** | 实例级防火墙 | stateful |\n| **NACL** | 子网级防火墙 | stateless |\n| **Route Table** | 路由表 | 决定下一跳 |\n| **Internet Gateway** | VPC 进出公网的门 | Public subnet |\n| **NAT Gateway** | 私有子网主动访问公网 | 单向出网 |\n| **VPC Endpoint** | 私网访问 AWS 服务 | Gateway / Interfa
